<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifehouse Duties</title>
<style>
/* Duties: who watches which child, and who is where, at wellbeing, break and lunch. Same look as the Timetabler. */
:root {
  --ground: #ECEFF3;
  --surface: #FFFFFF;
  --surface-2: #F5F7F9;
  --free: #F8FAFB;
  --ink: #16202A;
  --muted: #5A6775;
  --line: #D4DBE2;
  --line-strong: #B5C0CB;
  --map: #F4F6F9;
  --outline-bg: #EBEFF4;
  --accent: #1E4E8C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1EBF7;
  --pupil: #2C52B5;
  --pupil-bg: #E7EDFB;
  --pupil-line: #B8C7EF;
  --staff: #0B7459;
  --staff-bg: #DDF2EA;
  --staff-line: #A4D8C6;
  --ppa: #77419F;
  --ppa-bg: #F1E8F8;
  --off: #A2560F;
  --off-bg: #FDF3E7;
  --off-line: #C9772B;
  --out: #2F6B45;
  --out-bg: #EFF7F1;
  --out-line: #4F8D63;
  --hall: #3A4654;
  --tab-ink: #FFFFFF;
  --top: #15233A;
  --top-ink: #E8EEF6;
  --top-muted: #A9B6C7;
  --top-line: #2B3B55;
  --top-tab: #24406B;
  --save: #F2C66D;
  --save-ink: #2A1E05;
  --sheet-line: #8A949E;
  --sheet-place: #137A3A;
  --sheet-band-ink: #16202A;
  --band-lightblue: #DDEBF7;
  --band-blue: #8CC9EE;
  --band-green: #8EDC8E;
  --lesson-wellbeing: #E3F4E3;
  --lesson-academic: #E2EDF9;
  --staff-sheet-head: #F8C99B;
  --lesson-1: #2F6DB5; --lesson-1-bg: #E6EFFA; --lesson-2: #1E7F72; --lesson-2-bg: #E0F2EE;
  --lesson-3: #A8640A; --lesson-3-bg: #FCEFDA; --lesson-4: #A63F72; --lesson-4-bg: #F8E6EF;
  --staff-sheet-band: #FDEBD8;
  --book-head: #4E6B55; --book-gold: #D6A23E; --book-ink: #1F2A24; --book-muted: #4A584F;
  --book-band: #EEF2EC; --book-band-edge: #9CAE9F; --book-band-ink: #26332B; --book-empty-edge: #93A396;
  --book-academic: #E9DFF6; --book-academic-edge: #8A68C0; --book-academic-ink: #2B1D40; --book-academic-icon: #5B3E92;
  --book-numeracy: #FCDDBE; --book-numeracy-edge: #D9822F; --book-numeracy-ink: #3A2208; --book-numeracy-icon: #9A5212;
  --book-wellbeing: #FBF0C4; --book-wellbeing-edge: #C9A93A; --book-wellbeing-ink: #33270A; --book-wellbeing-icon: #8A6510;
  --book-champion: #FBEFC2; --book-champion-edge: #C9A23A; --book-champion-ink: #33270A; --book-champion-icon: #8A6510;
  --ok: #1B7339;
  --ok-bg: #E0F3E6;
  --warn: #9A5300;
  --warn-bg: #FCEFD9;
  --bad: #B0301D;
  --bad-bg: #FAE5E1;
  --tint-s: 52%;
  --tint-l: 90%;
  --paper: #FFFFFF;
  --paper-ink: #111418;
  --paper-muted: #4A535C;
  --paper-line: #8A949E;
  --paper-head: #EEF1F4;
  --shadow: 0 1px 2px rgba(22, 32, 42, .08), 0 2px 8px rgba(22, 32, 42, .05);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #11161C; --surface: #19202A; --surface-2: #1F2732; --free: #161C24;
    --ink: #E5EAF0; --muted: #96A2AE; --line: #2D3845; --line-strong: #3E4B5A; --map: #141A21; --outline-bg: #18202A;
    --accent: #84ABE6; --accent-ink: #0D1520; --accent-soft: #1E2E44;
    --pupil: #A3B8F4; --pupil-bg: #22305A; --pupil-line: #34477C;
    --staff: #84D6BA; --staff-bg: #153B31; --staff-line: #22584A;
    --ppa: #CCA6EE; --ppa-bg: #33244A; --off: #F0B47A; --off-bg: #33261A; --off-line: #B8743A;
    --out: #8FD3A6; --out-bg: #16291D; --out-line: #4F8A63; --hall: #A9B4C1; --tab-ink: #0D1520;
    --top: #0B1220; --top-ink: #E5EAF0; --top-muted: #96A2AE; --top-line: #26324A; --top-tab: #1E3150; --save: #E8B95A;
    --sheet-line: #3E4B5A; --sheet-place: #7FD49B; --sheet-band-ink: #0D1520; --band-lightblue: #A9C4DE; --band-blue: #6FAFD6; --band-green: #6FBF7A; --lesson-wellbeing: #1B3324; --lesson-academic: #1B2B40;
    --lesson-1: #3E7CC4; --lesson-1-bg: #1B2A3D; --lesson-2: #23887A; --lesson-2-bg: #16302B; --lesson-3: #B06E14; --lesson-3-bg: #35291A; --lesson-4: #B04A7E; --lesson-4-bg: #35202C;
    --ok: #82D49D; --ok-bg: #173825; --warn: #F0B866; --warn-bg: #3F2D0F; --bad: #F09C8D; --bad-bg: #481E18;
    --tint-s: 30%; --tint-l: 24%;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #11161C; --surface: #19202A; --surface-2: #1F2732; --free: #161C24;
  --ink: #E5EAF0; --muted: #96A2AE; --line: #2D3845; --line-strong: #3E4B5A; --map: #141A21; --outline-bg: #18202A;
  --accent: #84ABE6; --accent-ink: #0D1520; --accent-soft: #1E2E44;
  --pupil: #A3B8F4; --pupil-bg: #22305A; --pupil-line: #34477C;
  --staff: #84D6BA; --staff-bg: #153B31; --staff-line: #22584A;
  --ppa: #CCA6EE; --ppa-bg: #33244A; --off: #F0B47A; --off-bg: #33261A; --off-line: #B8743A;
    --out: #8FD3A6; --out-bg: #16291D; --out-line: #4F8A63; --hall: #A9B4C1; --tab-ink: #0D1520;
    --top: #0B1220; --top-ink: #E5EAF0; --top-muted: #96A2AE; --top-line: #26324A; --top-tab: #1E3150; --save: #E8B95A;
    --sheet-line: #3E4B5A; --sheet-place: #7FD49B; --sheet-band-ink: #0D1520; --band-lightblue: #A9C4DE; --band-blue: #6FAFD6; --band-green: #6FBF7A; --lesson-wellbeing: #1B3324; --lesson-academic: #1B2B40;
    --lesson-1: #3E7CC4; --lesson-1-bg: #1B2A3D; --lesson-2: #23887A; --lesson-2-bg: #16302B; --lesson-3: #B06E14; --lesson-3-bg: #35291A; --lesson-4: #B04A7E; --lesson-4-bg: #35202C;
  --ok: #82D49D; --ok-bg: #173825; --warn: #F0B866; --warn-bg: #3F2D0F; --bad: #F09C8D; --bad-bg: #481E18;
  --tint-s: 30%; --tint-l: 24%;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* Square corners throughout, as in the Timetabler. */
*, *::before, *::after { border-radius: 0 !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.4 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.app { min-height: 100%; display: flex; flex-direction: column; }

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding: 7px 16px; background: var(--top); color: var(--top-ink); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; color: var(--top-ink); flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.brand-sub { color: var(--top-muted); font-size: 12px; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab { border: 0; background: transparent; padding: 7px 14px; font-weight: 600; font-size: 13.5px; color: var(--top-muted); }
.tab:hover { color: var(--top-ink); }
.tab.on { background: var(--top-tab); color: var(--top-ink); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.topbar .btn { background: transparent; color: var(--top-ink); border-color: var(--top-line); }
.topbar .btn:hover:not(:disabled) { background: var(--top-tab); }
.topbar .btn.save { background: var(--save); border-color: var(--save); color: var(--save-ink); }
.topbar :focus-visible { outline-color: var(--top-ink); }

.btn { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; padding: 6px 11px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.x-btn { width: 24px; height: 24px; padding: 0; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; }
.x-btn:hover { border-color: var(--line-strong); color: var(--ink); }
.txt { border: 1px solid var(--line-strong); background: var(--surface); padding: 5px 8px; min-width: 0; }
.txt.sm { padding: 3px 6px; font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; }
.page { padding: 16px; max-width: 1400px; width: 100%; }
.page > h1 { font-size: 20px; margin-bottom: 4px; }
.page > .hint { margin: 0 0 14px; max-width: 900px; }
.card { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 14px; }
.card h2 { font-size: 15px; margin-bottom: 4px; }
.card > .hint { margin: 0 0 10px; }

/* Segmented choices: days, rule levels. */
.seg { display: inline-flex; border: 1px solid var(--line-strong); background: var(--surface); }
.seg button { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 5px 12px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); background: var(--surface-2); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

/* Names: staff chips have a solid left edge; pupils are blue. */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; font-weight: 650; font-size: 12px; line-height: 1; padding: 0 7px; border: 1px solid var(--pupil-line); background: var(--pupil-bg); color: var(--pupil); white-space: nowrap; user-select: none; }
.chip.staff { border-left: 3px solid var(--staff); border-color: var(--staff-line); background: var(--staff-bg); color: var(--staff); cursor: grab; }
.chip.staff.warn { box-shadow: inset 0 -2px 0 var(--warn); }
.chip.staff.bad { border-color: var(--bad); border-left-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.chip .flag { font-weight: 800; }
.chip.sel { background: var(--staff); color: var(--surface); border-color: var(--staff); }
.chip.faded { opacity: .55; }

/* ---------- Start ---------- */
.start { max-width: 640px; margin: 48px auto; }
.start h1 { font-size: 24px; margin-bottom: 8px; }
.start .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }

/* ---------- Rota ---------- */
.rota-bar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 10px; }
.rota-bar .spacer { flex: 1; }
.rota-sum { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.rota-sum b { color: var(--ink); }
.rota-sum .bad { color: var(--bad); font-weight: 700; }
.rota-sum .warn { color: var(--warn); font-weight: 700; }
.rota-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .rota-wrap { grid-template-columns: 1fr; } }
.table-scroll { overflow-x: auto; }
table.rota { border-collapse: collapse; width: 100%; background: var(--surface); min-width: 640px; }
.rota th, .rota td { border: 1px solid var(--line); padding: 0; vertical-align: top; text-align: left; }
.rota thead th { background: var(--surface-2); padding: 6px 8px; font-size: 13px; }
.rota thead th small { display: block; font-weight: 500; color: var(--muted); }
.rota tbody th { padding: 6px 8px; width: 170px; font-weight: 600; font-size: 13px; }
.rota tbody th small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
.rota tr.band th { background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 4px 8px; }
.cell-btn { cursor: pointer; width: 100%; min-height: 46px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; align-items: center; padding: 6px; border: 0; background: transparent; text-align: left; }
.cell-btn:hover { background: var(--surface-2); }
td.short { background: var(--warn-bg); }
td.bad { box-shadow: inset 3px 0 0 var(--bad); }
td.warn { box-shadow: inset 3px 0 0 var(--warn); }
td.ok { box-shadow: inset 3px 0 0 var(--ok); }
td.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
td.none { background: var(--free); }
.need { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border: 1px dashed var(--warn); color: var(--warn); font-size: 12px; font-weight: 650; }
.away { color: var(--muted); font-size: 12px; font-style: italic; padding: 6px 8px; display: block; }
.mark { margin-left: auto; font-weight: 800; font-size: 12px; min-width: 14px; text-align: right; }
.mark.ok { color: var(--ok); }
.mark.warn { color: var(--warn); }
.mark.bad { color: var(--bad); }
.issues { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; }
.issues h2 { font-size: 14px; margin-bottom: 6px; }
.issues ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; }
.issues li { padding-left: 10px; border-left: 3px solid var(--warn); }
.issues li.bad { border-left-color: var(--bad); }
.issues li b { font-weight: 650; }
.tray { background: var(--surface); border: 1px solid var(--line); padding: 10px; position: sticky; top: 8px; }
.tray.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
.tray h2 { font-size: 13px; margin-bottom: 2px; }
.tray .hint { font-size: 12px; margin: 0 0 8px; }
.tray-list { display: flex; flex-direction: column; gap: 3px; max-height: 70vh; overflow: auto; }
.tray-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.tray-row .chip { flex: none; }
.tray-row .n { margin-left: auto; font-variant-numeric: tabular-nums; }

/* Week: who has what, for fair shares. */
table.week { border-collapse: collapse; width: 100%; background: var(--surface); font-size: 12.5px; }
.week th, .week td { border: 1px solid var(--line); padding: 5px 7px; vertical-align: top; text-align: left; }
.week thead th { background: var(--surface-2); }
.week td.total { font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; width: 60px; }
.week td.total.hi { color: var(--warn); background: var(--warn-bg); }
.week .d { display: block; }
.week .d i { color: var(--muted); font-style: normal; }

/* ---------- Picker ---------- */
dialog.dlg { border: 1px solid var(--line); padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0, 0, 0, .25); }
dialog.dlg::backdrop { background: rgba(10, 16, 24, .45); }
.dlg-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 8px; }
.dlg-head h2 { font-size: 16px; }
.dlg-head .hint { margin: 2px 0 0; }
.dlg-head .x-btn { margin-left: auto; }
.dlg-body { padding: 12px 16px; max-height: 65vh; overflow: auto; }
.dlg-foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
.now { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.now .chip { cursor: default; }
.cands { display: grid; gap: 4px; }
.cand { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.cand:hover { border-color: var(--accent); }
.cand .why { font-size: 12px; color: var(--muted); }
.cand .why .bad { color: var(--bad); font-weight: 600; }
.cand .why .warn { color: var(--warn); font-weight: 600; }
.cand .why .good { color: var(--ok); font-weight: 600; }
.cand .tag { font-size: 11px; font-weight: 700; padding: 2px 6px; background: var(--accent-soft); color: var(--accent); }
.cand.blocked { background: var(--surface-2); }
.sub-h { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 12px 0 4px; font-weight: 700; }

/* ---------- Setup tables ---------- */
table.set { border-collapse: collapse; width: 100%; font-size: 13px; }
.set th, .set td { border-bottom: 1px solid var(--line); padding: 6px 6px; text-align: left; vertical-align: middle; }
.set thead th { font-size: 12px; color: var(--muted); font-weight: 600; }
.ticks { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.ticks label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.people-line { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.add-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.rule { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.rule:last-child { border-bottom: 0; }
.rule h3 { font-size: 14px; }
.rule p { margin: 2px 0 0; color: var(--muted); font-size: 13px; max-width: 760px; }
.rule .n { width: 56px; }
.pick-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 10px; }
.pick-list label { display: flex; align-items: center; gap: 6px; }

/* ---------- Toasts ---------- */
.toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 2000; pointer-events: none; max-width: calc(100vw - 32px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--surface); padding: 9px 14px; font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }

/* ---------- Print: a day sheet per page ---------- */
#print { display: none; }
@media print {
  @page { size: A4 landscape; margin: 12mm; }
  body { background: #fff; color: #000; }
  .app, .toasts, dialog { display: none !important; }
  #print { display: block; }
  .p-day { break-after: page; font-family: var(--font); }
  .p-day:last-child { break-after: auto; }
  .p-day h2 { font-size: 18pt; margin-bottom: 6pt; }
  .p-day p { margin: 0 0 8pt; font-size: 10pt; color: #333; }
  .p-day table { border-collapse: collapse; width: 100%; font-size: 11pt; }
  .p-day th, .p-day td { border: 1px solid #666; padding: 5pt 6pt; text-align: left; vertical-align: top; }
  .p-day thead th { background: #EEF1F4; }
  .p-day td i { color: #555; }
}
</style>
</head>
<body>
<div class="app"><header class="topbar" id="top"></header><main id="view"></main></div>
<div id="print"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="file-open" accept=".json,application/json" hidden>
<script>
(() => {
  'use strict';
  // Lifehouse Duties: reads the timetable (never changes it) and keeps its own rota.
  const STORE = 'lifehouse_duties_v1', TT_KEY = 'lifehouse_timetabler_v2', APP = 'lifehouse-duties';
  const DAYS = [{ id: 'Mon', name: 'Monday' }, { id: 'Tue', name: 'Tuesday' }, { id: 'Wed', name: 'Wednesday' }, { id: 'Thu', name: 'Thursday' }, { id: 'Fri', name: 'Friday' }];
  const DAY_IDS = DAYS.map((d) => d.id);
  const OUT = 'OUT', NOT_PLACES = new Set(['', 'OUT', 'PPA', 'COVER', 'NONE', 'OFF']);
  const KINDS = { wellbeing: 'Wellbeing', break: 'Break', lunch: 'Lunch', other: 'Other' };
  const LEVELS = ['must', 'try', 'off'], LEVEL_NAMES = { must: 'Must', try: 'Try to', off: 'Off' };

            h('td', null, h('button', { type: 'button', class: 'x-btn', title: 'Remove', 'aria-label': 'Remove ' + p.name, onclick: () => change(() => { D.watches.splice(i, 1); }, p.name + ' taken off the list') }, '×')));
        }))) : h('p', { class: 'hint' }, 'No children yet.'),
        h('div', { class: 'add-row' }, sel, h('button', { type: 'button', class: 'btn primary', onclick: () => { if (!sel.value) return; const id = sel.value; change(() => { D.watches.push({ pupil: id, need: 1, times: times.map((t) => t.id), only: [], never: [], note: '' }); }, person(id).name + ' added, at every time'); } }, 'Add'))));
  }
  function peopleCell(ids, emptyText, onEdit) {
    const list = ids.map(person).filter(Boolean);
    return h('div', { class: 'people-line' }, list.length ? list.map((p) => h('span', { class: 'chip staff' }, p.name)) : h('span', { class: 'hint' }, emptyText), h('button', { type: 'button', class: 'btn small', onclick: onEdit }, 'Choose…'));
  }
  function choosePeople(title, sub, ids, done) {
    const boxes = TT.staff.map((s) => h('input', { type: 'checkbox', value: s.id, checked: ids.includes(s.id) }));
    const dlg = modal(title, sub, h('div', { class: 'pick-list' }, TT.staff.map((s, i) => h('label', null, boxes[i], s.name))),
      [h('button', { type: 'button', class: 'btn', onclick: () => dlg.close() }, 'Cancel'), h('button', { type: 'button', class: 'btn primary', onclick: () => { dlg.close(); done(boxes.filter((b) => b.checked).map((b) => b.value)); } }, 'Save')]);
  }

  // ----- Areas and activities -----
  function postsPage() {
    const times = sortedTimes();
    const upd = (i, fn) => change(() => fn(D.posts[i]));
    const addPost = (kind) => change(() => { let n = 1; while (D.posts.some((p) => p.id === 'A' + n)) n++; D.posts.push({ id: 'A' + n, name: kind === 'activity' ? 'New activity' : 'New area', kind, need: 1, times: times.filter((t) => t.kind !== 'wellbeing').map((t) => t.id), days: DAY_IDS.slice(), note: '' }); });
    return h('div', { class: 'page' }, h('h1', null, 'Areas and activities'),
      h('p', { class: 'hint' }, 'The places that need adults, and the lunchtime activities. These are starting points: staff still move to where the children are.'),
      h('div', { class: 'card' }, h('table', { class: 'set' },
        h('thead', null, h('tr', null, h('th', null, 'Name'), h('th', null, 'Kind'), h('th', null, 'Adults'), h('th', null, 'Times'), h('th', null, 'Days'), h('th', null, ''))),
        h('tbody', null, D.posts.map((p, i) => h('tr', { dataset: { post: p.id } },
          h('td', null, h('input', { class: 'txt sm', value: p.name, 'aria-label': 'Name', onchange: (e) => upd(i, (x) => { x.name = str(e.target.value) || x.name; }) })),
          h('td', null, h('select', { class: 'txt sm', 'aria-label': 'Kind', onchange: (e) => upd(i, (x) => { x.kind = e.target.value; }) }, h('option', { value: 'area', selected: p.kind === 'area' }, 'Area'), h('option', { value: 'activity', selected: p.kind === 'activity' }, 'Activity'))),
          h('td', null, h('select', { class: 'txt sm', 'aria-label': 'Adults for ' + p.name, onchange: (e) => upd(i, (x) => { x.need = +e.target.value; }) }, [1, 2, 3, 4, 5, 6].map((n) => h('option', { value: n, selected: p.need === n }, n)))),
          h('td', null, h('div', { class: 'ticks' }, times.map((t) => h('label', null, h('input', { type: 'checkbox', checked: p.times.includes(t.id), 'aria-label': p.name + ' at ' + t.name, onchange: (e) => upd(i, (x) => { x.times = e.target.checked ? x.times.concat(t.id) : x.times.filter((y) => y !== t.id); }) }), t.name)))),
          h('td', null, h('div', { class: 'ticks' }, DAYS.map((d) => h('label', null, h('input', { type: 'checkbox', checked: p.days.includes(d.id), 'aria-label': p.name + ' on ' + d.name, onchange: (e) => upd(i, (x) => { x.days = e.target.checked ? x.days.concat(d.id) : x.days.filter((y) => y !== d.id); }) }), d.name.slice(0, 3))))),
          h('td', null, h('button', { type: 'button', class: 'x-btn', 'aria-label': 'Remove ' + p.name, onclick: () => change(() => { D.posts.splice(i, 1); }, p.name + ' removed') }, '×')))))),
        h('div', { class: 'add-row' }, h('button', { type: 'button', class: 'btn', onclick: () => addPost('area') }, 'Add an area'), h('button', { type: 'button', class: 'btn', onclick: () => addPost('activity') }, 'Add an activity'))));
  }

  // ----- Rules -----
  function rulesPage() {
    const set = (id, patch) => change(() => { D.rules[id] = Object.assign({ level: lvl(id), n: ruleN(id) || null }, D.rules[id], patch); });
    return h('div', { class: 'page' }, h('h1', null, 'Rules'),
      h('p', { class: 'hint' }, 'Must: Suggest never breaks it, and the rota marks it ! if someone does. Try to: Suggest avoids it where it can. Off: ignored. Nobody is ever put on duty when the timetable says they are not in.'),
      h('div', { class: 'card' }, RULES.map((r) => h('div', { class: 'rule', dataset: { rule: r.id } },
        h('div', null, h('h3', null, r.name), h('p', null, r.text),
          r.n ? h('label', { class: 'hint' }, 'At most ', h('input', { class: 'txt sm n', type: 'number', min: 1, max: 8, value: ruleN(r.id), 'aria-label': 'Most duties a day', onchange: (e) => set(r.id, { n: clampInt(e.target.value, 1, 8, r.n) }) }), ' a day') : null),
        h('div', { class: 'seg', role: 'group', 'aria-label': r.name }, (r.levels || LEVELS).map((l) => h('button', { type: 'button', class: lvl(r.id) === l ? 'on' : '', 'aria-pressed': lvl(r.id) === l ? 'true' : 'false', onclick: () => set(r.id, { level: l }) }, LEVEL_NAMES[l])))))));
  }

  // ----- Times and staff -----
  function timesPage() {
    const times = sortedTimes();
    const updT = (id, fn) => change(() => { fn(timeById(id)); D.timesEdited = true; aroundCache.clear(); });
    const next = (t) => { const a = around(t); return [a.touchBefore ? 'after ' + a.touchBefore.label : '', a.touchAfter ? 'before ' + a.touchAfter.label : ''].filter(Boolean).join(', ') || '—'; };
    const updS = (sid, fn) => change(() => { D.staff[sid] = Object.assign({ duties: true, teacher: null, notAt: [] }, D.staff[sid]); fn(D.staff[sid]); });
    return h('div', { class: 'page' }, h('h1', null, 'Times and staff'),
      h('div', { class: 'card' }, h('h2', null, 'Duty times'), h('p', { class: 'hint' }, 'Taken from the school day in the Timetabler, with lunch split in two. A lesson that ends or starts within 10 minutes counts as straight before or after.'),
        h('table', { class: 'set' }, h('thead', null, h('tr', null, h('th', null, 'Name'), h('th', null, 'From'), h('th', null, 'To'), h('th', null, 'Kind'), h('th', null, 'Next to'), h('th', null, ''))),
          h('tbody', null, times.map((t) => h('tr', { dataset: { time: t.id } },
            h('td', null, h('input', { class: 'txt sm', value: t.name, 'aria-label': 'Name', onchange: (e) => updT(t.id, (x) => { x.name = str(e.target.value) || x.name; }) })),
            h('td', null, h('input', { class: 'txt sm', value: t.start, size: 7, 'aria-label': t.name + ' from', onchange: (e) => updT(t.id, (x) => { const m = minutesOf(e.target.value); if (m != null) x.start = clock(m); }) })),
            h('td', null, h('input', { class: 'txt sm', value: t.end, size: 7, 'aria-label': t.name + ' to', onchange: (e) => updT(t.id, (x) => { const m = minutesOf(e.target.value); if (m != null) x.end = clock(m); }) })),
            h('td', null, h('select', { class: 'txt sm', 'aria-label': t.name + ' kind', onchange: (e) => updT(t.id, (x) => { x.kind = e.target.value; }) }, Object.entries(KINDS).map(([k, v]) => h('option', { value: k, selected: t.kind === k }, v)))),
            h('td', { class: 'hint' }, next(t)),
            h('td', null, times.length > 1 ? h('button', { type: 'button', class: 'x-btn', 'aria-label': 'Remove ' + t.name, onclick: () => change(() => { D.times = D.times.filter((x) => x.id !== t.id); D.timesEdited = true; aroundCache.clear(); }, t.name + ' removed') }, '×') : null))))),
        h('div', { class: 'add-row' }, h('button', { type: 'button', class: 'btn', onclick: () => change(() => { let n = 1; while (D.times.some((x) => x.id === 'T' + n)) n++; D.times.push({ id: 'T' + n, name: 'New duty time', start: '3.10pm', end: '3.30pm', kind: 'other' }); D.timesEdited = true; aroundCache.clear(); }) }, 'Add a time'))),
      h('div', { class: 'card' }, h('h2', null, 'Staff'), h('p', { class: 'hint' }, 'Teachers start as the staff who lead lessons on the timetable. Untick Does duties for anyone who never does them, and tick the times someone is never free.'),
        h('table', { class: 'set' }, h('thead', null, h('tr', null, h('th', null, 'Name'), h('th', null, 'Teacher'), h('th', null, 'Does duties'), h('th', null, 'Never free at'))),
          h('tbody', null, TT.staff.map((s) => { const st = staffSet(s.id);
            return h('tr', { dataset: { staff: s.id } }, h('th', { scope: 'row' }, s.name),
              h('td', null, h('input', { type: 'checkbox', checked: isTeacher(s.id), 'aria-label': s.name + ' is a teacher', onchange: (e) => updS(s.id, (x) => { x.teacher = e.target.checked; }) })),
              h('td', null, h('input', { type: 'checkbox', checked: st.duties !== false, 'aria-label': s.name + ' does duties', onchange: (e) => updS(s.id, (x) => { x.duties = e.target.checked; }) })),
              h('td', null, h('div', { class: 'ticks' }, times.map((t) => h('label', null, h('input', { type: 'checkbox', checked: st.notAt.includes(t.id), 'aria-label': s.name + ' never free at ' + t.name, onchange: (e) => updS(s.id, (x) => { x.notAt = e.target.checked ? x.notAt.concat(t.id) : x.notAt.filter((y) => y !== t.id); }) }), t.name)))));
          })))));
  }

  // ---------- Files ----------
  function download(name, text) {
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: name });
    document.body.append(a); a.click(); a.remove();
  }
  function saveFile() {
    const d = new Date(), stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const name = ((D.tt.school || 'School') + ' duties - ' + stamp).replace(/[\\/:*?"<>|]+/g, ' ') + '.json';
    download(name, JSON.stringify(D, null, 1));
    toast('Saved “' + name + '”. Keep it safe: it has names in it.');
  }
  function openFile() { const inp = document.getElementById('file-open'); inp.value = ''; inp.click(); }
  document.getElementById('file-open').addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    let obj;
    try { obj = JSON.parse((await f.text()).replace(/^﻿/, '')); } catch (err) { toast('“' + f.name + '” is not a duties file or timetable backup.'); return; }
    if (obj && obj.app === APP) {
      pushUndo(); D = clean(obj); index(); save(); render();
      toast('Opened the duties in “' + f.name + '”.', { label: 'Undo', run: undo });
    } else if (readTimetable(obj, 'file')) { save(); render(); toast('Read the timetable in “' + f.name + '”: ' + plural(TT.staff.length, 'member') + ' of staff, ' + plural(TT.pupils.length, 'pupil') + '.'); }
    else toast('“' + f.name + '” is not a duties file or timetable backup.');
  });
  document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !document.querySelector('dialog[open]')) { e.preventDefault(); undo(); } });

  index();
  render();
})();
</script>
</body>
</html>
