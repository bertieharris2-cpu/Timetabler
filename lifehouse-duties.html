<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifehouse Duties</title>
<style>
/* Duties: who watches which child, and who is where, at wellbeing, break and lunch. Same look as the Timetabler. */
:root {
  --ground: #ECEFF3;
  --surface: #FFFFFF;
  --surface-2: #F5F7F9;
  --free: #F8FAFB;
  --ink: #16202A;
  --muted: #5A6775;
  --line: #D4DBE2;
  --line-strong: #B5C0CB;
  --map: #F4F6F9;
  --outline-bg: #EBEFF4;
  --accent: #1E4E8C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1EBF7;
  --pupil: #2C52B5;
  --pupil-bg: #E7EDFB;
  --pupil-line: #B8C7EF;
  --staff: #0B7459;
  --staff-bg: #DDF2EA;
  --staff-line: #A4D8C6;
  --ppa: #77419F;
  --ppa-bg: #F1E8F8;
  --off: #A2560F;
  --off-bg: #FDF3E7;
  --off-line: #C9772B;
  --out: #2F6B45;
  --out-bg: #EFF7F1;
  --out-line: #4F8D63;
  --hall: #3A4654;
  --tab-ink: #FFFFFF;
  --top: #15233A;
  --top-ink: #E8EEF6;
  --top-muted: #A9B6C7;
  --top-line: #2B3B55;
  --top-tab: #24406B;
  --save: #F2C66D;
  --save-ink: #2A1E05;
  --sheet-line: #8A949E;
  --sheet-place: #137A3A;
  --sheet-band-ink: #16202A;
  --band-lightblue: #DDEBF7;
  --band-blue: #8CC9EE;
  --band-green: #8EDC8E;
  --lesson-wellbeing: #E3F4E3;
  --lesson-academic: #E2EDF9;
  --staff-sheet-head: #F8C99B;
  --lesson-1: #2F6DB5; --lesson-1-bg: #E6EFFA; --lesson-2: #1E7F72; --lesson-2-bg: #E0F2EE;
  --lesson-3: #A8640A; --lesson-3-bg: #FCEFDA; --lesson-4: #A63F72; --lesson-4-bg: #F8E6EF;
  --staff-sheet-band: #FDEBD8;
  --book-head: #4E6B55; --book-gold: #D6A23E; --book-ink: #1F2A24; --book-muted: #4A584F;
  --book-band: #EEF2EC; --book-band-edge: #9CAE9F; --book-band-ink: #26332B; --book-empty-edge: #93A396;
  --book-academic: #E9DFF6; --book-academic-edge: #8A68C0; --book-academic-ink: #2B1D40; --book-academic-icon: #5B3E92;
  --book-numeracy: #FCDDBE; --book-numeracy-edge: #D9822F; --book-numeracy-ink: #3A2208; --book-numeracy-icon: #9A5212;
  --book-wellbeing: #FBF0C4; --book-wellbeing-edge: #C9A93A; --book-wellbeing-ink: #33270A; --book-wellbeing-icon: #8A6510;
  --book-champion: #FBEFC2; --book-champion-edge: #C9A23A; --book-champion-ink: #33270A; --book-champion-icon: #8A6510;
  --ok: #1B7339;
  --ok-bg: #E0F3E6;
  --warn: #9A5300;
  --warn-bg: #FCEFD9;
  --bad: #B0301D;
  --bad-bg: #FAE5E1;
  --tint-s: 52%;
  --tint-l: 90%;
  --paper: #FFFFFF;
  --paper-ink: #111418;
  --paper-muted: #4A535C;
  --paper-line: #8A949E;
  --paper-head: #EEF1F4;
  --shadow: 0 1px 2px rgba(22, 32, 42, .08), 0 2px 8px rgba(22, 32, 42, .05);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #11161C; --surface: #19202A; --surface-2: #1F2732; --free: #161C24;
    --ink: #E5EAF0; --muted: #96A2AE; --line: #2D3845; --line-strong: #3E4B5A; --map: #141A21; --outline-bg: #18202A;
    --accent: #84ABE6; --accent-ink: #0D1520; --accent-soft: #1E2E44;
    --pupil: #A3B8F4; --pupil-bg: #22305A; --pupil-line: #34477C;
    --staff: #84D6BA; --staff-bg: #153B31; --staff-line: #22584A;
    --ppa: #CCA6EE; --ppa-bg: #33244A; --off: #F0B47A; --off-bg: #33261A; --off-line: #B8743A;
    --out: #8FD3A6; --out-bg: #16291D; --out-line: #4F8A63; --hall: #A9B4C1; --tab-ink: #0D1520;
    --top: #0B1220; --top-ink: #E5EAF0; --top-muted: #96A2AE; --top-line: #26324A; --top-tab: #1E3150; --save: #E8B95A;
    --sheet-line: #3E4B5A; --sheet-place: #7FD49B; --sheet-band-ink: #0D1520; --band-lightblue: #A9C4DE; --band-blue: #6FAFD6; --band-green: #6FBF7A; --lesson-wellbeing: #1B3324; --lesson-academic: #1B2B40;
    --lesson-1: #3E7CC4; --lesson-1-bg: #1B2A3D; --lesson-2: #23887A; --lesson-2-bg: #16302B; --lesson-3: #B06E14; --lesson-3-bg: #35291A; --lesson-4: #B04A7E; --lesson-4-bg: #35202C;
    --ok: #82D49D; --ok-bg: #173825; --warn: #F0B866; --warn-bg: #3F2D0F; --bad: #F09C8D; --bad-bg: #481E18;
    --tint-s: 30%; --tint-l: 24%;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #11161C; --surface: #19202A; --surface-2: #1F2732; --free: #161C24;
  --ink: #E5EAF0; --muted: #96A2AE; --line: #2D3845; --line-strong: #3E4B5A; --map: #141A21; --outline-bg: #18202A;
  --accent: #84ABE6; --accent-ink: #0D1520; --accent-soft: #1E2E44;
  --pupil: #A3B8F4; --pupil-bg: #22305A; --pupil-line: #34477C;
  --staff: #84D6BA; --staff-bg: #153B31; --staff-line: #22584A;
  --ppa: #CCA6EE; --ppa-bg: #33244A; --off: #F0B47A; --off-bg: #33261A; --off-line: #B8743A;
    --out: #8FD3A6; --out-bg: #16291D; --out-line: #4F8A63; --hall: #A9B4C1; --tab-ink: #0D1520;
    --top: #0B1220; --top-ink: #E5EAF0; --top-muted: #96A2AE; --top-line: #26324A; --top-tab: #1E3150; --save: #E8B95A;
    --sheet-line: #3E4B5A; --sheet-place: #7FD49B; --sheet-band-ink: #0D1520; --band-lightblue: #A9C4DE; --band-blue: #6FAFD6; --band-green: #6FBF7A; --lesson-wellbeing: #1B3324; --lesson-academic: #1B2B40;
    --lesson-1: #3E7CC4; --lesson-1-bg: #1B2A3D; --lesson-2: #23887A; --lesson-2-bg: #16302B; --lesson-3: #B06E14; --lesson-3-bg: #35291A; --lesson-4: #B04A7E; --lesson-4-bg: #35202C;
  --ok: #82D49D; --ok-bg: #173825; --warn: #F0B866; --warn-bg: #3F2D0F; --bad: #F09C8D; --bad-bg: #481E18;
  --tint-s: 30%; --tint-l: 24%;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* Square corners throughout, as in the Timetabler. */
*, *::before, *::after { border-radius: 0 !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.4 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.app { min-height: 100%; display: flex; flex-direction: column; }

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding: 7px 16px; background: var(--top); color: var(--top-ink); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; color: var(--top-ink); flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.brand-sub { color: var(--top-muted); font-size: 12px; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab { border: 0; background: transparent; padding: 7px 14px; font-weight: 600; font-size: 13.5px; color: var(--top-muted); }
.tab:hover { color: var(--top-ink); }
.tab.on { background: var(--top-tab); color: var(--top-ink); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.topbar .btn { background: transparent; color: var(--top-ink); border-color: var(--top-line); }
.topbar .btn:hover:not(:disabled) { background: var(--top-tab); }
.topbar .btn.save { background: var(--save); border-color: var(--save); color: var(--save-ink); }
.topbar :focus-visible { outline-color: var(--top-ink); }

.btn { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; padding: 6px 11px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.x-btn { width: 24px; height: 24px; padding: 0; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; }
.x-btn:hover { border-color: var(--line-strong); color: var(--ink); }
.txt { border: 1px solid var(--line-strong); background: var(--surface); padding: 5px 8px; min-width: 0; }
.txt.sm { padding: 3px 6px; font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; }
.page { padding: 16px; max-width: 1400px; width: 100%; }
.page > h1 { font-size: 20px; margin-bottom: 4px; }
.page > .hint { margin: 0 0 14px; max-width: 900px; }
.card { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 14px; }
.card h2 { font-size: 15px; margin-bottom: 4px; }
.card > .hint { margin: 0 0 10px; }

/* Segmented choices: days, rule levels. */
.seg { display: inline-flex; border: 1px solid var(--line-strong); background: var(--surface); }
.seg button { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 5px 12px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); background: var(--surface-2); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

/* Names: staff chips have a solid left edge; pupils are blue. */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; font-weight: 650; font-size: 12px; line-height: 1; padding: 0 7px; border: 1px solid var(--pupil-line); background: var(--pupil-bg); color: var(--pupil); white-space: nowrap; user-select: none; }
.chip.staff { border-left: 3px solid var(--staff); border-color: var(--staff-line); background: var(--staff-bg); color: var(--staff); cursor: grab; }
.chip.staff.warn { box-shadow: inset 0 -2px 0 var(--warn); }
.chip.staff.bad { border-color: var(--bad); border-left-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.chip .flag { font-weight: 800; }
.chip.sel { background: var(--staff); color: var(--surface); border-color: var(--staff); }
.chip.faded { opacity: .55; }

/* ---------- Start ---------- */
.start { max-width: 640px; margin: 48px auto; }
.start h1 { font-size: 24px; margin-bottom: 8px; }
.start .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }

/* ---------- Rota ---------- */
.rota-bar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 10px; }
.rota-bar .spacer { flex: 1; }
.rota-sum { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.rota-sum b { color: var(--ink); }
.rota-sum .bad { color: var(--bad); font-weight: 700; }
.rota-sum .warn { color: var(--warn); font-weight: 700; }
.rota-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .rota-wrap { grid-template-columns: 1fr; } }
.table-scroll { overflow-x: auto; }
table.rota { border-collapse: collapse; width: 100%; background: var(--surface); min-width: 640px; }
.rota th, .rota td { border: 1px solid var(--line); padding: 0; vertical-align: top; text-align: left; }
.rota thead th { background: var(--surface-2); padding: 6px 8px; font-size: 13px; }
.rota thead th small { display: block; font-weight: 500; color: var(--muted); }
.rota tbody th { padding: 6px 8px; width: 170px; font-weight: 600; font-size: 13px; }
.rota tbody th small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
.rota tr.band th { background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 4px 8px; }
.cell-btn { cursor: pointer; width: 100%; min-height: 46px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; align-items: center; padding: 6px; border: 0; background: transparent; text-align: left; }
.cell-btn:hover { background: var(--surface-2); }
td.short { background: var(--warn-bg); }
td.bad { box-shadow: inset 3px 0 0 var(--bad); }
td.warn { box-shadow: inset 3px 0 0 var(--warn); }
td.ok { box-shadow: inset 3px 0 0 var(--ok); }
td.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
td.none { background: var(--free); }
.need { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border: 1px dashed var(--warn); color: var(--warn); font-size: 12px; font-weight: 650; }
.away { color: var(--muted); font-size: 12px; font-style: italic; padding: 6px 8px; display: block; }
.mark { margin-left: auto; font-weight: 800; font-size: 12px; min-width: 14px; text-align: right; }
.mark.ok { color: var(--ok); }
.mark.warn { color: var(--warn); }
.mark.bad { color: var(--bad); }
.issues { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; }
.issues h2 { font-size: 14px; margin-bottom: 6px; }
.issues ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; }
.issues li { padding-left: 10px; border-left: 3px solid var(--warn); }
.issues li.bad { border-left-color: var(--bad); }
.issues li b { font-weight: 650; }
.tray { background: var(--surface); border: 1px solid var(--line); padding: 10px; position: sticky; top: 8px; }
.tray.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
.tray h2 { font-size: 13px; margin-bottom: 2px; }
.tray .hint { font-size: 12px; margin: 0 0 8px; }
.tray-list { display: flex; flex-direction: column; gap: 3px; max-height: 70vh; overflow: auto; }
.tray-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.tray-row .chip { flex: none; }
.tray-row .n { margin-left: auto; font-variant-numeric: tabular-nums; }

/* Week: who has what, for fair shares. */
table.week { border-collapse: collapse; width: 100%; background: var(--surface); font-size: 12.5px; }
.week th, .week td { border: 1px solid var(--line); padding: 5px 7px; vertical-align: top; text-align: left; }
.week thead th { background: var(--surface-2); }
.week td.total { font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; width: 60px; }
.week td.total.hi { color: var(--warn); background: var(--warn-bg); }
.week .d { display: block; }
.week .d i { color: var(--muted); font-style: normal; }

.strip { display: flex; gap: 6px; flex-wrap: wrap; }
.strip-day { display: flex; flex-direction: column; gap: 3px; padding: 3px 5px 5px; }
.strip-day.on { background: var(--accent-soft); }
.strip-dayname { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding-left: 2px; }
.strip-day.on .strip-dayname { color: var(--accent); }
.strip-periods { display: flex; gap: 3px; }
.strip-btn { width: 40px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0; line-height: 1.1; }
.strip-btn:hover { border-color: var(--accent); }
.strip-label { font-size: 12px; font-weight: 600; }
.strip-mark { font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; min-height: 12px; }
.strip-btn.empty .strip-mark { color: var(--muted); font-weight: 500; }
.strip-btn.done { border-color: var(--ok); }
.strip-btn.done .strip-mark { color: var(--ok); }
.strip-btn.todo .strip-mark { color: var(--warn); }
.strip-btn.alert { border-color: var(--bad); }
.strip-btn.alert .strip-mark { color: var(--bad); }
.strip-btn.empty .strip-mark { color: var(--muted); }

/* ---------- Layout: the school map at one duty time (Navy plan, as in the Timetabler) ---------- */
.lay { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
@media (max-width: 1000px) { .lay { grid-template-columns: 1fr; } }
.lay-bar { display: flex; align-items: flex-end; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 10px; }
.lay-now { font-size: 15px; font-weight: 700; }
.lay-now span { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.mapwrap { overflow: auto; border: 1px solid var(--line); background: var(--map); padding: 28px 10px 10px; }
.map { position: relative; min-width: 860px; height: 600px; }
.outline { position: absolute; background: var(--outline-bg); pointer-events: none; }
.outline.t-off, .outline.t-out { background: transparent; }
.outline-name { position: absolute; left: -1px; bottom: 100%; display: inline-flex; align-items: baseline; gap: 8px; padding: 3px 9px; white-space: nowrap; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; background: var(--accent); color: var(--tab-ink); }
.outline.t-hall .outline-name { background: var(--hall); }
.outline.t-off .outline-name { background: var(--off); }
.outline.t-out .outline-name { background: var(--out); }
.walls { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 2; }
.walls path { fill: none; stroke-width: 2; stroke-linecap: square; }
.walls .t-main { stroke: var(--accent); }
.walls .t-hall { stroke: var(--hall); }
.walls .t-off { stroke: var(--off-line); stroke-dasharray: 7 5; stroke-linecap: butt; }
.walls .t-out { stroke: var(--out-line); stroke-dasharray: 7 5; stroke-linecap: butt; }
.room { position: absolute; display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.room.open-t { border-top: 1px dashed var(--line-strong); }
.room.open-b { border-bottom-color: transparent; }
.room.open-l { border-left: 1px dashed var(--line-strong); }
.room.open-r { border-right-color: transparent; }
.room.offsite { background: var(--off-bg); opacity: .6; }
.room.t-out { background: var(--out-bg); }
.room-head { display: flex; align-items: center; gap: 6px; padding: 5px 7px 1px; }
.room-ic { width: 15px; height: 15px; flex: none; color: var(--accent); }
.room.offsite .room-ic { color: var(--off); }
.room.t-out .room-ic { color: var(--out); }
.room-name { flex: 1; min-width: 0; font-size: 12px; font-weight: 700; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.room.duty { background: var(--accent-soft); cursor: pointer; }
.room.duty.idle { background: var(--surface); cursor: default; }
.room.duty.short { box-shadow: inset 0 0 0 2px var(--warn); }
.room.duty.bad { box-shadow: inset 0 0 0 2px var(--bad); }
.room.drop-ok { outline: 2px dashed var(--accent); outline-offset: -3px; }
.room-duty { padding: 2px 7px 6px; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; position: relative; z-index: 3; }
.room-duty > b { width: 100%; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.room-duty .hint { font-size: 11px; }
.room.oob { background: repeating-linear-gradient(135deg, var(--surface-2) 0 7px, var(--line) 7px 8px); }
.room.oob .room-name, .room.oob .room-ic { color: var(--muted); }
.room-oob { margin: 2px 7px; align-self: flex-start; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface); padding: 1px 5px; border: 1px solid var(--line-strong); }
.map.editing .room { cursor: pointer; }
.map.editing .room:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
.side { display: flex; flex-direction: column; gap: 10px; }
.side .tray { position: static; }
.side-list { display: grid; gap: 4px; }
.side-row { display: grid; grid-template-columns: 74px 1fr; gap: 6px; align-items: start; padding: 5px 6px; border: 1px solid var(--line); border-left-width: 3px; background: var(--surface); cursor: pointer; }
.side-row.ok { border-left-color: var(--ok); }
.side-row.warn, .side-row.short { border-left-color: var(--warn); }
.side-row.bad { border-left-color: var(--bad); }
.side-row.away { cursor: default; background: var(--free); }
.side-row.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
.side-row .who { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.side-row .away-t { font-size: 11.5px; color: var(--muted); font-style: italic; }
.tray-row .st { font-size: 11px; }
.tray-row .st.busy { color: var(--accent); }
.tray-row .st.off { color: var(--off); }
.opt-list { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.opt:hover { border-color: var(--accent); }
.opt.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.opt b { display: block; }
.opt span { font-size: 12.5px; color: var(--muted); }
.week-rota td { min-width: 140px; }

/* ---------- Picker ---------- */
dialog.dlg { border: 1px solid var(--line); padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0, 0, 0, .25); }
dialog.dlg::backdrop { background: rgba(10, 16, 24, .45); }
.dlg-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 8px; }
.dlg-head h2 { font-size: 16px; }
.dlg-head .hint { margin: 2px 0 0; }
.dlg-head .x-btn { margin-left: auto; }
.dlg-body { padding: 12px 16px; max-height: 65vh; overflow: auto; }
.dlg-foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
.now { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.now .chip { cursor: default; }
.cands { display: grid; gap: 4px; }
.cand { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.cand:hover { border-color: var(--accent); }
.cand .why { font-size: 12px; color: var(--muted); }
.cand .why .bad { color: var(--bad); font-weight: 600; }
.cand .why .warn { color: var(--warn); font-weight: 600; }
.cand .why .good { color: var(--ok); font-weight: 600; }
.cand .tag { font-size: 11px; font-weight: 700; padding: 2px 6px; background: var(--accent-soft); color: var(--accent); }
.cand.blocked { background: var(--surface-2); }
.sub-h { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 12px 0 4px; font-weight: 700; }

/* ---------- Setup tables ---------- */
table.set { border-collapse: collapse; width: 100%; font-size: 13px; }
.set th, .set td { border-bottom: 1px solid var(--line); padding: 6px 6px; text-align: left; vertical-align: middle; }
.set thead th { font-size: 12px; color: var(--muted); font-weight: 600; }
.ticks { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.ticks label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.people-line { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.add-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.rule { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.rule:last-child { border-bottom: 0; }
.rule h3 { font-size: 14px; }
.rule p { margin: 2px 0 0; color: var(--muted); font-size: 13px; max-width: 760px; }
.rule .n { width: 56px; }
.pick-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 10px; }
.pick-list label { display: flex; align-items: center; gap: 6px; }

/* ---------- Toasts ---------- */
.toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 2000; pointer-events: none; max-width: calc(100vw - 32px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--surface); padding: 9px 14px; font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }

/* ---------- Print: a day sheet per page ---------- */
#print { display: none; }
@media print {
  @page { size: A4 landscape; margin: 12mm; }
  body { background: #fff; color: #000; }
  .app, .toasts, dialog { display: none !important; }
  #print { display: block; }
  .p-day { break-after: page; font-family: var(--font); }
  .p-day:last-child { break-after: auto; }
  .p-day h2 { font-size: 18pt; margin-bottom: 6pt; }
  .p-day p { margin: 0 0 8pt; font-size: 10pt; color: #333; }
  .p-day table { border-collapse: collapse; width: 100%; font-size: 11pt; }
  .p-day th, .p-day td { border: 1px solid #666; padding: 5pt 6pt; text-align: left; vertical-align: top; }
  .p-day thead th { background: #EEF1F4; }
  .p-day td i { color: #555; }
}
</style>
</head>

<script>
(() => {
  'use strict';
  // Lifehouse Duties: reads the timetable (never changes it) and keeps its own rota.

  const DEFAULT_TIMES = [
    { id: 'W', name: 'Wellbeing', start: '9.00am', end: '9.45am', kind: 'wellbeing' },

  // Children roam the school, so duty areas are parts of the building that need an adult: to start, the main room
  // (the open-plan learning spaces as one), and the lunchtime activity. The science room starts out of bounds.
  const DEFAULT_POSTS = [
    { id: 'A1', name: 'Main room', kind: 'area', need: 2, times: ['B', 'L1', 'L2'], days: DAY_IDS.slice(), rooms: [], note: '' },
    { id: 'A2', name: 'Lunchtime activity', kind: 'activity', need: 1, times: ['L2'], days: DAY_IDS.slice(), rooms: [], note: '' }];
  function postsFromMap(areas) {
    const posts = clone(DEFAULT_POSTS);
    posts[0].rooms = areas.filter((a) => /learning space/i.test(a.name)).map((a) => a.id);
    return { posts, oob: areas.filter((a) => /science/i.test(a.name)).map((a) => a.id) };
  }
  // The rules she sets: each one Must (never broken by Suggest, shown as !), Try to (avoided where it can), or Off.
  const RULES = [
    { id: 'offsite', def: 'must', name: 'Not on duty next to being off site', text: 'Nobody is on duty straight after coming back from off site, or just before going out. Off-site places come from the timetable.' },
    { id: 'lunchOff', def: 'must', name: 'Everyone has part of lunch off', text: 'Nobody is on duty for every part of lunch, so everyone gets a break.' },
    { id: 'maxDay', def: 'must', name: 'At most a set number of duties a day', text: 'How many duties one person can have in a day.', n: 2 },
    { id: 'teacherBreak', def: 'try', name: 'Teachers have break off', text: 'Teachers are the staff who lead lessons on the timetable (change this in Times and staff).' },
    { id: 'teacherLunch', def: 'off', name: 'Teachers have lunch off', text: 'Teachers’ conditions often say they can’t be made to supervise at lunch. Check how this applies to your school.' },
    { id: 'breakSame', def: 'try', name: 'At break, keep the adult the child was with', text: 'Break is short, so the adult who had the child in the lesson before (or has them next) keeps them, with no handover.' },
    { id: 'lunchFresh', def: 'try', name: 'At lunch, a different adult from the lesson before', text: 'Someone who has just had the child for a lesson gets a change at lunch.' },
    { id: 'fair', def: 'try', name: 'Share duties out fairly', text: 'Duties are spread over the week, so nobody has many more than others.', levels: ['try', 'off'] },
    { id: 'sameWeek', def: 'off', name: 'The same adult for a child every day', text: 'For children who need the same face: whoever watches them at a time on one day does it every day.' }];
  const RULE = Object.fromEntries(RULES.map((r) => [r.id, r]));

  const str = (v) => (v == null ? '' : String(v)).trim();
  const arr = (v) => (Array.isArray(v) ? v.map(str).filter(Boolean) : []);
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const clampInt = (v, lo, hi, d) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
  const dayName = (id) => (DAYS.find((d) => d.id === id) || { name: id }).name;
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many || one + 's');
  const byName = (a, b) => a.name.localeCompare(b.name);
  const names = (list) => list.map((p) => p.name).join(', ');
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked' || k === 'disabled' || k === 'selected') el[k] = !!v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
    return el;
  }
  // "9.00am", "1.10pm", "13:10", "1:10" (after midday when there is no am or pm) as minutes since midnight.
  function minutesOf(t) {
    const m = /(\d{1,2})[.:](\d{2})\s*(am|pm)?/i.exec(str(t));
    if (!m) return null;
    let hh = +m[1]; const mm = +m[2], ap = (m[3] || '').toLowerCase();
    if (ap === 'pm' && hh < 12) hh += 12; else if (ap === 'am' && hh === 12) hh = 0; else if (!ap && hh < 8) hh += 12;
    return hh * 60 + mm;
  }
  function clock(min) { const hh = Math.floor(min / 60), mm = min % 60; return (hh > 12 ? hh - 12 : hh) + '.' + String(mm).padStart(2, '0') + (hh >= 12 ? 'pm' : 'am'); }

  // Room icons and walls, as on the Timetabler's map.
  function svg(markup) { const t = document.createElement('template'); t.innerHTML = markup.trim(); return t.content.firstChild; }
  const ROOM_ICONS = {
    hall: '<path d="M2 14h12M3 14V7l5-4 5 4v7M6.5 14v-4h3v4"/>',
    book: '<path d="M2 3.5h4.5a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 0-1.5-1.5H2zM14 3.5H9.5A1.5 1.5 0 0 0 8 5v8.5A1.5 1.5 0 0 1 9.5 12H14z"/>',
    cook: '<path d="M4 2v4.5a1.5 1.5 0 0 0 3 0V2M5.5 2v12M11 2c-1.2 1-1.5 3-1.5 4.5s.5 2 1.5 2V14"/>',
    meet: '<circle cx="5" cy="5.5" r="2"/><circle cx="11" cy="5.5" r="2"/><path d="M1.5 13c0-2 1.6-3.5 3.5-3.5S8.5 11 8.5 13M7.5 13c0-2 1.6-3.5 3.5-3.5s3.5 1.5 3.5 3.5"/>',
    flask: '<path d="M6 2h4M6.5 2v4L3 13h10L9.5 6V2M4.5 10h7"/>',
    tools: '<path d="M9.5 3.5a3 3 0 0 0 3 4L6 14l-2-2 6.5-6.5a3 3 0 0 0-1-2zM3 3l3 3"/>',
    door: '<path d="M4 14V2h8v12M2.5 14h11M9.5 8.5v.01"/>',
    leaf: '<path d="M3 13c0-6 4-10 10-10 0 6-4 10-10 10zM3 13l6-6"/>',
    paw: '<circle cx="4" cy="7" r="1.3"/><circle cx="6.5" cy="4" r="1.3"/><circle cx="9.5" cy="4" r="1.3"/><circle cx="12" cy="7" r="1.3"/><path d="M5 12c0-2 1.5-3.5 3-3.5S11 10 11 12c0 1-1 1.5-3 1.5S5 13 5 12z"/>',
    pod: '<path d="M2 14h12M3 14V8l5-3.5L13 8v6M6 14v-3h4v3"/>',
    tree: '<path d="M8 14v-3M4 11h8L8 3z"/>',
    shoe: '<path d="M4.5 13V8a3.5 3.5 0 0 1 7 0v5M3.5 13h2M10.5 13h2"/>',
    home: '<path d="M2.5 8 8 3l5.5 5M4 7v7h8V7"/>',
    pin: '<path d="M8 14s4.5-4.2 4.5-7.5a4.5 4.5 0 0 0-9 0C3.5 9.8 8 14 8 14z"/><circle cx="8" cy="6.5" r="1.5"/>',
    person: '<circle cx="8" cy="5" r="2.5"/><path d="M3 14c0-2.8 2.2-5 5-5s5 2.2 5 5"/>',
    clock: '<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/>',
    // Lesson symbols for picture timetables
    numbers: '<path d="M2.5 5.5 4.5 4v8M2.5 12h4M8.5 5.8a2 2 0 1 1 3.3 1.6L8.5 12h5"/>',
    letters: '<path d="M1.5 13 5 3l3.5 10M2.8 9.5h4.4M14 8.5V13M14 10.8a2 2 0 1 0 0 .4"/>',
    monitor: '<path d="M2 3h12v8H2zM6 14h4M8 11v3"/>',
    ball: '<circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2.2 2 2.2 10 0 12M8 2c-2.2 2-2.2 10 0 12"/>',
    waves: '<path d="M1.5 6c2-1.5 3-1.5 4.3 0s2.3 1.5 4.4 0 3-1.5 4.3 0M1.5 10.5c2-1.5 3-1.5 4.3 0s2.3 1.5 4.4 0 3-1.5 4.3 0"/>',
    bee: '<ellipse cx="8" cy="10" rx="3" ry="3.8"/><path d="M5.2 9h5.6M5.2 11.5h5.6M7 6.3 5.5 3.5M9 6.3l1.5-2.8M5.3 8C3.5 6.5 1.5 7 2 8.7s2.8 1.2 3.4.6M10.7 8c1.8-1.5 3.8-1 3.3.7s-2.8 1.2-3.4.6"/>',
    palette: '<path d="M8 2a6 6 0 1 0 0 12c1 0 1.5-.7 1.5-1.5S9 11 9 10.3c0-.8.7-1.3 1.5-1.3H12a2 2 0 0 0 2-2C14 4.3 11.3 2 8 2z"/><circle cx="5" cy="7.5" r=".9"/><circle cx="7.5" cy="5" r=".9"/><circle cx="10.6" cy="5.6" r=".9"/>',
    note: '<path d="M6 12V3.5l7-1.5v8.5"/><circle cx="4.3" cy="12" r="1.8"/><circle cx="11.3" cy="10.5" r="1.8"/>',
    heart: '<path d="M8 13.5S2 10 2 6a3 3 0 0 1 6-1 3 3 0 0 1 6 1c0 4-6 7.5-6 7.5z"/>',
    cup: '<path d="M3 5.5h8v4.5a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3zM11 7h1.3a1.5 1.5 0 0 1 0 3H11M5.5 2v1.5M7.5 2v1.5M9.5 2v1.5"/>',
    plate: '<circle cx="9.5" cy="8" r="4.5"/><circle cx="9.5" cy="8" r="2"/><path d="M2.5 2.5V14M1.5 2.5v3a1 1 0 0 0 2 0v-3"/>',
    star: '<path d="M8 1.8l1.9 4 4.3.5-3.2 2.9.9 4.3L8 11.3l-3.9 2.2.9-4.3L1.8 6.3l4.3-.5z"/>',
    dice: '<path d="M2.5 2.5h11v11h-11z"/><circle cx="5.5" cy="5.5" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="10.5" cy="10.5" r="1"/>',
    briefcase: '<path d="M2 5h12v8H2zM5.5 5V3h5v2M2 8.5h12"/>',
    bus: '<path d="M3 2.5h10v9H3zM3 7.5h10M5 11.5v2M11 11.5v2"/><circle cx="5.5" cy="9.5" r=".7"/><circle cx="10.5" cy="9.5" r=".7"/>'
  };
  const ICON_RULES = [[/kitchen|cook/i, 'cook'], [/\bpod\b/i, 'pod'], [/hall/i, 'hall'], [/literacy|learning|lounge|class|library/i, 'book'],
    [/conference|brook|meeting/i, 'meet'], [/science|lab/i, 'flask'], [/\bdt\b|design|workshop/i, 'tools'], [/garden|polytunnel|allotment|green/i, 'leaf'],
    [/animal|pet|farm/i, 'paw'], [/wood|forest/i, 'tree'], [/stable|horse|riding/i, 'shoe'], [/village|town|shop/i, 'home']];
  function iconName(name, kind) { for (const [re, k] of ICON_RULES) if (re.test(name)) return k; return kind === 'offsite' ? 'pin' : 'door'; }
  function roomIcon(k, cls) { return svg('<svg class="' + (cls || 'room-ic') + '" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">' + (ROOM_ICONS[k] || ROOM_ICONS.door) + '</svg>'); }
  function wallPath(rects) {
    const r2 = (v) => Math.round(v * 100) / 100;
    const xs = [...new Set(rects.flatMap((o) => [r2(o.x), r2(o.x + o.w)]))].sort((a, b) => a - b);
    const ys = [...new Set(rects.flatMap((o) => [r2(o.y), r2(o.y + o.h)]))].sort((a, b) => a - b);
    const inside = (i, j) => {
      if (i < 0 || j < 0 || i >= xs.length - 1 || j >= ys.length - 1) return false;
      const cx = (xs[i] + xs[i + 1]) / 2, cy = (ys[j] + ys[j + 1]) / 2;
      return rects.some((o) => cx > o.x && cx < o.x + o.w && cy > o.y && cy < o.y + o.h);
    };
    let d = '';
    for (let j = 0; j < ys.length; j++) {
      let start = null;
      for (let i = 0; i <= xs.length - 1; i++) {
        const edge = i < xs.length - 1 && inside(i, j - 1) !== inside(i, j);
        if (edge && start === null) start = xs[i];
        if (!edge && start !== null) { d += 'M' + start + ' ' + ys[j] + 'H' + xs[i]; start = null; }
      }
    }
    for (let i = 0; i < xs.length; i++) {
      let start = null;
      for (let j = 0; j <= ys.length - 1; j++) {
        const edge = j < ys.length - 1 && inside(i - 1, j) !== inside(i, j);
        if (edge && start === null) start = ys[j];
        if (!edge && start !== null) { d += 'M' + xs[i] + ' ' + start + 'V' + ys[j]; start = null; }
      }
    }
    return d;
  }

  // ---------- Saved state ----------
  function blank() { return { app: APP, v: 1, tt: null, timesEdited: false, postsEdited: false, times: clone(DEFAULT_TIMES), posts: clone(DEFAULT_POSTS), outOfBounds: [], watches: [], staff: {}, rules: {}, rota: {} }; }
  function clean(o) {
    const out = blank();
    if (!o || typeof o !== 'object') return out;
    out.tt = o.tt && Array.isArray(o.tt.people) ? o.tt : null;
    out.timesEdited = !!o.timesEdited;
    out.postsEdited = !!o.postsEdited;
    out.outOfBounds = arr(o.outOfBounds);
    if (Array.isArray(o.times) && o.times.length) {
      const seen = new Set();
      out.times = o.times.filter((t) => t && str(t.id) && !seen.has(str(t.id)) && seen.add(str(t.id))).map((t) => ({ id: str(t.id), name: str(t.name) || 'Duty', start: str(t.start), end: str(t.end), kind: KINDS[t.kind] ? t.kind : 'other' }));
    }
    const tids = new Set(out.times.map((t) => t.id));
    if (Array.isArray(o.posts)) out.posts = o.posts.filter((p) => p && str(p.id)).map((p) => ({ id: str(p.id), name: str(p.name) || 'Area', kind: p.kind === 'activity' ? 'activity' : 'area', need: clampInt(p.need, 1, 6, 1),
      times: arr(p.times).filter((x) => tids.has(x)), days: (Array.isArray(p.days) ? arr(p.days) : DAY_IDS.slice()).filter((x) => DAY_IDS.includes(x)), rooms: arr(p.rooms), note: str(p.note) }));
    if (Array.isArray(o.watches)) {
      const seen = new Set();
      out.watches = o.watches.filter((w) => w && str(w.pupil) && !seen.has(str(w.pupil)) && seen.add(str(w.pupil))).map((w) => ({ pupil: str(w.pupil), need: clampInt(w.need, 1, 4, 1),
        times: arr(w.times).filter((x) => tids.has(x)), days: (Array.isArray(w.days) ? arr(w.days) : DAY_IDS.slice()).filter((x) => DAY_IDS.includes(x)), only: arr(w.only), never: arr(w.never), note: str(w.note) }));
    }

      const ok = list.filter((c) => c.sc != null).sort((a, b) => a.sc - b.sc), no = list.filter((c) => c.sc == null && staffSet(c.x.id).duties !== false);
      const row = (c, i, blocked) => h('button', { type: 'button', class: 'cand' + (blocked ? ' blocked' : ''), onclick: () => add(c.x.id) },
        h('span', { class: 'chip staff' + (blocked ? ' bad' : c.P.length ? ' warn' : '') }, c.x.name),
        h('span', { class: 'why' }, c.good.map((g) => h('span', { class: 'good' }, g + '. ')), c.P.map((p) => h('span', { class: p.level === 'must' ? 'bad' : 'warn' }, p.text + '. ')),
          !c.P.length && !c.good.length ? 'Free. ' : '', plural(dayDuties(c.x.id, day).length, 'duty', 'duties') + ' today, ' + weekCount(c.x.id) + ' this week'),

      return [
        h('div', { class: 'now' }, ids.length ? ids.map((id) => h('span', { class: 'chip staff' }, person(id).name, h('button', { type: 'button', class: 'x-btn', 'aria-label': 'Take ' + person(id).name + ' off', onclick: () => remove(id) }, '×'))) : h('span', { class: 'hint' }, 'Nobody yet.'),
          s.need > ids.length ? h('span', { class: 'need' }, 'Needs ' + (s.need - ids.length)) : null),
        h('div', { class: 'sub-h' }, 'Can do it'), h('div', { class: 'cands' }, ok.length ? ok.map((c, i) => row(c, i, false)) : h('p', { class: 'hint' }, 'Nobody is free under the Must rules.')),
        no.length ? [h('div', { class: 'sub-h' }, 'Would break a Must rule'), h('div', { class: 'cands' }, no.map((c, i) => row(c, i, true)))] : null];
    };
    const refresh = () => { save(); render(); if (dlg && dlg.open) dlg.querySelector('.dlg-body').replaceChildren(...body().flat(Infinity).filter(Boolean)); };
    const add = (id) => { pushUndo(); setCell(day, tid, key, cellIds(day, tid, key).concat(id)); if (cellIds(day, tid, key).length >= s.need) { dlg.close(); save(); render(); toast(person(id).name + ' on ' + t.name + ': ' + s.name, { label: 'Undo', run: undo }); } else refresh(); };
    const remove = (id) => { pushUndo(); setCell(day, tid, key, cellIds(day, tid, key).filter((x) => x !== id)); refresh(); };
    dlg = modal(dayName(day) + ' · ' + timeLabel(t), (s.kind === 'watch' ? 'Watching ' + s.name : s.name + ' (' + (s.kind === 'activity' ? 'activity' : 'area') + ')') + (s.need > 1 ? ', ' + s.need + ' adults' : ''), body(),

  }
  function weekTable() {

        h('tbody', null, TT.staff.filter((s) => staffSet(s.id).duties !== false).map((s) => {
          const n = weekCount(s.id);
          return h('tr', null, h('th', { scope: 'row' }, s.name),
            DAYS.map((d) => h('td', null, dayDuties(s.id, d.id).sort((a, b) => times.indexOf(a.t) - times.indexOf(b.t)).map((x) => h('span', { class: 'd' }, h('i', null, x.t.name + ': '), x.s.name)))),
            h('td', { class: 'total' + (avg && n >= avg + 2 ? ' hi' : '') }, n, avg && n >= avg + 2 ? ' !' : ''));
        })))));
  }
  function printDays(days) {
    const times = sortedTimes();

      const keys = new Map();

        h('p', null, (D.tt.school || '') + ' · Adults on a watch stay with that child; on an area, follow where the children are.' + (D.outOfBounds.length ? ' Out of bounds: ' + D.outOfBounds.map((id) => (TT.areas.get(id) || {}).name).filter(Boolean).join(', ') + '.' : '')),
        h('table', null, h('thead', null, h('tr', null, h('th', null, ''), times.map((t) => h('th', null, t.name + ' ' + t.start)))),
          h('tbody', null, [...keys.values()].map((s0) => h('tr', null, h('th', null, s0.kind === 'watch' ? 'Watch ' + s0.name : s0.name),
            times.map((t) => { const s = spotsAt(day, t.id).find((x) => x.key === s0.key); return h('td', null, !s ? '' : s.away ? h('i', null, s.away) : names(cellIds(day, t.id, s.key).map(person)) || '—'); }))))));

  }

  // ----- Children to watch -----
  function childrenPage() {
    const times = sortedTimes(), have = new Set(D.watches.map((w) => w.pupil));
    const sel = h('select', { class: 'txt', 'aria-label': 'Child to add' }, h('option', { value: '' }, 'Choose a child…'), TT.pupils.filter((p) => !have.has(p.id)).map((p) => h('option', { value: p.id }, p.name)));

      h('div', { class: 'card' }, D.watches.length ? h('table', { class: 'set' },
        h('thead', null, h('tr', null, h('th', null, 'Child'), h('th', null, 'Times'), h('th', null, 'Days'), h('th', null, 'Adults'), h('th', null, 'Only these adults'), h('th', null, 'Never with'), h('th', null, 'Note'), h('th', null, ''))),
        h('tbody', null, D.watches.map((w, i) => { const p = person(w.pupil); if (!p) return null;

        }))) : h('p', { class: 'hint' }, 'No children yet.'),
        h('div', { class: 'add-row' }, sel, h('button', { type: 'button', class: 'btn primary', onclick: () => { if (!sel.value) return; const id = sel.value; change(() => { D.watches.push({ pupil: id, need: 1, times: times.map((t) => t.id), days: DAY_IDS.slice(), only: [], never: [], note: '' }); }, person(id).name + ' added, at every time'); } }, 'Add'))));
  }
  function peopleCell(ids, emptyText, onEdit) {
    const list = ids.map(person).filter(Boolean);
    return h('div', { class: 'people-line' }, list.length ? list.map((p) => h('span', { class: 'chip staff' }, p.name)) : h('span', { class: 'hint' }, emptyText), h('button', { type: 'button', class: 'btn small', onclick: onEdit }, 'Choose…'));
  }
  function choosePeople(title, sub, ids, done, list) {
    const items = list || TT.staff;

  // ----- Areas and activities -----
  function postsPage() {
    const times = sortedTimes();

    const addPost = (kind) => change(() => { let n = 1; while (D.posts.some((p) => p.id === 'A' + n)) n++; D.posts.push({ id: 'A' + n, name: kind === 'activity' ? 'New activity' : 'New area', kind, need: 1, times: times.filter((t) => t.kind !== 'wellbeing').map((t) => t.id), days: DAY_IDS.slice(), rooms: [], note: '' }); D.postsEdited = true; });
    const rooms = [...TT.areas.values()].filter((a) => a.kind !== 'offsite' && a.kind !== 'staff').sort(byName);
    const roomNames = (ids) => ids.map((id) => (TT.areas.get(id) || {}).name).filter(Boolean);
    return h('div', { class: 'page' }, h('h1', null, 'Areas and activities'),
      h('p', { class: 'hint' }, 'Children roam the school, so these are the parts that need adults, and the lunchtime activities. An area can take in several rooms, such as the learning spaces as one main room; not every room needs an adult. These are starting points: staff still move to where the children are. Rooms can also be set up on the Rota’s Layout.'),
      h('div', { class: 'card' }, h('table', { class: 'set' },
        h('thead', null, h('tr', null, h('th', null, 'Name'), h('th', null, 'Kind'), h('th', null, 'Rooms'), h('th', null, 'Adults'), h('th', null, 'Times'), h('th', null, 'Days'), h('th', null, ''))),
        h('tbody', null, D.posts.map((p, i) => h('tr', { dataset: { post: p.id } },
          h('td', null, h('input', { class: 'txt sm', value: p.name, 'aria-label': 'Name', onchange: (e) => upd(i, (x) => { x.name = str(e.target.value) || x.name; }) })),
          h('td', null, h('select', { class: 'txt sm', 'aria-label': 'Kind', onchange: (e) => upd(i, (x) => { x.kind = e.target.value; }) }, h('option', { value: 'area', selected: p.kind === 'area' }, 'Area'), h('option', { value: 'activity', selected: p.kind === 'activity' }, 'Activity'))),
          h('td', null, h('div', { class: 'people-line' }, roomNames(p.rooms).length ? h('span', null, roomNames(p.rooms).join(', ')) : h('span', { class: 'hint' }, p.kind === 'activity' ? 'Not on the map' : 'None'),
            h('button', { type: 'button', class: 'btn small', onclick: () => choosePeople('Rooms in ' + p.name, 'The rooms this duty area covers.', p.rooms, (ids) => upd(i, (x) => { x.rooms = ids; D.posts.forEach((o) => { if (o !== x) o.rooms = o.rooms.filter((r) => !ids.includes(r)); }); D.outOfBounds = D.outOfBounds.filter((r) => !ids.includes(r)); }), rooms) }, 'Choose…'))),

          h('td', null, h('div', { class: 'ticks' }, DAYS.map((d) => h('label', null, h('input', { type: 'checkbox', checked: p.days.includes(d.id), 'aria-label': p.name + ' on ' + d.name, onchange: (e) => upd(i, (x) => { x.days = e.target.checked ? x.days.concat(d.id) : x.days.filter((y) => y !== d.id); }) }), d.name.slice(0, 3))))),
          h('td', null, h('button', { type: 'button', class: 'x-btn', 'aria-label': 'Remove ' + p.name, onclick: () => change(() => { D.posts.splice(i, 1); D.postsEdited = true; }, p.name + ' removed') }, '×')))))),
        h('div', { class: 'add-row' }, h('button', { type: 'button', class: 'btn', onclick: () => addPost('area') }, 'Add an area'), h('button', { type: 'button', class: 'btn', onclick: () => addPost('activity') }, 'Add an activity'))),
      h('div', { class: 'card' }, h('h2', null, 'Out of bounds'), h('p', { class: 'hint' }, 'Rooms children should not be in at duty times. They show hatched on the Layout.'),
        h('div', { class: 'people-line' }, roomNames(D.outOfBounds).length ? h('span', null, roomNames(D.outOfBounds).join(', ')) : h('span', { class: 'hint' }, 'None'),
          h('button', { type: 'button', class: 'btn small', onclick: () => choosePeople('Out of bounds', 'Rooms children should not be in at duty times.', D.outOfBounds, (ids) => change(() => { D.outOfBounds = ids; D.posts.forEach((o) => { o.rooms = o.rooms.filter((r) => !ids.includes(r)); }); D.postsEdited = true; }), rooms) }, 'Choose…'))));
  }

  // ----- Rules -----
  function rulesPage() {
    const set = (id, patch) => change(() => { D.rules[id] = Object.assign({ level: lvl(id), n: ruleN(id) || null }, D.rules[id], patch); });
    return h('div', { class: 'page' }, h('h1', null, 'Rules'),
      h('p', { class: 'hint' }, 'Must: Suggest never breaks it, and the rota marks it ! if someone does. Try to: Suggest avoids it where it can. Off: ignored. Nobody is ever put on duty when the timetable says they are not in.'),
      h('div', { class: 'card' }, RULES.map((r) => h('div', { class: 'rule', dataset: { rule: r.id } },
        h('div', null, h('h3', null, r.name), h('p', null, r.text),
          r.n ? h('label', { class: 'hint' }, 'At most ', h('input', { class: 'txt sm n', type: 'number', min: 1, max: 8, value: ruleN(r.id), 'aria-label': 'Most duties a day', onchange: (e) => set(r.id, { n: clampInt(e.target.value, 1, 8, r.n) }) }), ' a day') : null),
        h('div', { class: 'seg', role: 'group', 'aria-label': r.name }, (r.levels || LEVELS).map((l) => h('button', { type: 'button', class: lvl(r.id) === l ? 'on' : '', 'aria-pressed': lvl(r.id) === l ? 'true' : 'false', onclick: () => set(r.id, { level: l }) }, LEVEL_NAMES[l])))))));
  }

  // ----- Times and staff -----
  function timesPage() {
    const times = sortedTimes();
    const updT = (id, fn) => change(() => { fn(timeById(id)); D.timesEdited = true; aroundCache.clear(); });
    const next = (t) => { const a = around(t); return [a.touchBefore ? 'after ' + a.touchBefore.label : '', a.touchAfter ? 'before ' + a.touchAfter.label : ''].filter(Boolean).join(', ') || '—'; };
    const updS = (sid, fn) => change(() => { D.staff[sid] = Object.assign({ duties: true, teacher: null, notAt: [] }, D.staff[sid]); fn(D.staff[sid]); });
    return h('div', { class: 'page' }, h('h1', null, 'Times and staff'),
      h('div', { class: 'card' }, h('h2', null, 'Duty times'), h('p', { class: 'hint' }, 'Taken from the school day in the Timetabler, with lunch split in two. A lesson that ends or starts within 10 minutes counts as straight before or after.'),
        h('table', { class: 'set' }, h('thead', null, h('tr', null, h('th', null, 'Name'), h('th', null, 'From'), h('th', null, 'To'), h('th', null, 'Kind'), h('th', null, 'Next to'), h('th', null, ''))),
          h('tbody', null, times.map((t) => h('tr', { dataset: { time: t.id } },
            h('td', null, h('input', { class: 'txt sm', value: t.name, 'aria-label': 'Name', onchange: (e) => updT(t.id, (x) => { x.name = str(e.target.value) || x.name; }) })),
            h('td', null, h('input', { class: 'txt sm', value: t.start, size: 7, 'aria-label': t.name + ' from', onchange: (e) => updT(t.id, (x) => { const m = minutesOf(e.target.value); if (m != null) x.start = clock(m); }) })),
            h('td', null, h('input', { class: 'txt sm', value: t.end, size: 7, 'aria-label': t.name + ' to', onchange: (e) => updT(t.id, (x) => { const m = minutesOf(e.target.value); if (m != null) x.end = clock(m); }) })),
            h('td', null, h('select', { class: 'txt sm', 'aria-label': t.name + ' kind', onchange: (e) => updT(t.id, (x) => { x.kind = e.target.value; }) }, Object.entries(KINDS).map(([k, v]) => h('option', { value: k, selected: t.kind === k }, v)))),
            h('td', { class: 'hint' }, next(t)),
            h('td', null, times.length > 1 ? h('button', { type: 'button', class: 'x-btn', 'aria-label': 'Remove ' + t.name, onclick: () => change(() => { D.times = D.times.filter((x) => x.id !== t.id); D.timesEdited = true; aroundCache.clear(); }, t.name + ' removed') }, '×') : null))))),
        h('div', { class: 'add-row' }, h('button', { type: 'button', class: 'btn', onclick: () => change(() => { let n = 1; while (D.times.some((x) => x.id === 'T' + n)) n++; D.times.push({ id: 'T' + n, name: 'New duty time', start: '3.10pm', end: '3.30pm', kind: 'other' }); D.timesEdited = true; aroundCache.clear(); }) }, 'Add a time'))),
      h('div', { class: 'card' }, h('h2', null, 'Staff'), h('p', { class: 'hint' }, 'Teachers start as the staff who lead lessons on the timetable. Untick Does duties for anyone who never does them, and tick the times someone is never free.'),
        h('table', { class: 'set' }, h('thead', null, h('tr', null, h('th', null, 'Name'), h('th', null, 'Teacher'), h('th', null, 'Does duties'), h('th', null, 'Never free at'))),
          h('tbody', null, TT.staff.map((s) => { const st = staffSet(s.id);
            return h('tr', { dataset: { staff: s.id } }, h('th', { scope: 'row' }, s.name),
              h('td', null, h('input', { type: 'checkbox', checked: isTeacher(s.id), 'aria-label': s.name + ' is a teacher', onchange: (e) => updS(s.id, (x) => { x.teacher = e.target.checked; }) })),
              h('td', null, h('input', { type: 'checkbox', checked: st.duties !== false, 'aria-label': s.name + ' does duties', onchange: (e) => updS(s.id, (x) => { x.duties = e.target.checked; }) })),
              h('td', null, h('div', { class: 'ticks' }, times.map((t) => h('label', null, h('input', { type: 'checkbox', checked: st.notAt.includes(t.id), 'aria-label': s.name + ' never free at ' + t.name, onchange: (e) => updS(s.id, (x) => { x.notAt = e.target.checked ? x.notAt.concat(t.id) : x.notAt.filter((y) => y !== t.id); }) }), t.name)))));
          })))));
  }

  // ---------- Files ----------
  function download(name, text) {
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: name });
    document.body.append(a); a.click(); a.remove();
  }
  function saveFile() {
    const d = new Date(), stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const name = ((D.tt.school || 'School') + ' duties - ' + stamp).replace(/[\\/:*?"<>|]+/g, ' ') + '.json';
    if (TT) D.published = published();
    download(name, JSON.stringify(D, null, 1));
    toast('Saved “' + name + '”. Keep it safe: it has names in it.');
  }
  function openFile() { const inp = document.getElementById('file-open'); inp.value = ''; inp.click(); }
  document.getElementById('file-open').addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    let obj;
    try { obj = JSON.parse((await f.text()).replace(/^﻿/, '')); } catch (err) { toast('“' + f.name + '” is not a duties file or timetable backup.'); return; }
    if (obj && obj.app === APP) {
      pushUndo(); D = clean(obj); index(); save(); render();
      toast('Opened the duties in “' + f.name + '”.', { label: 'Undo', run: undo });
    } else if (readTimetable(obj, 'file')) { save(); render(); toast('Read the timetable in “' + f.name + '”: ' + plural(TT.staff.length, 'member') + ' of staff, ' + plural(TT.pupils.length, 'pupil') + '.'); }
    else toast('“' + f.name + '” is not a duties file or timetable backup.');
  });
  document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !document.querySelector('dialog[open]')) { e.preventDefault(); undo(); } });

  index();
  render();
})();
</script>
