<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifehouse Timetabler</title>
<style>
/* Layout: the school's site plan on graph paper, a tray of names beside it, and the week as a strip of periods above. */
:root {
  --ground: #ECEFF3;
  --surface: #FFFFFF;
  --surface-2: #F5F7F9;
  --free: #F8FAFB;
  --ink: #16202A;
  --muted: #5A6775;
  --line: #D4DBE2;
  --line-strong: #B5C0CB;
  --grid: #E1E6EB;
  --outline-bg: #E3E8EE;
  --accent: #1E4E8C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1EBF7;
  --pupil: #2C52B5;
  --pupil-bg: #E7EDFB;
  --pupil-line: #B8C7EF;
  --staff: #0B7459;
  --staff-bg: #DDF2EA;
  --staff-line: #A4D8C6;
  --ppa: #77419F;
  --ppa-bg: #F1E8F8;
  --off: #0A6684;
  --off-bg: #DFF0F6;
  --ok: #1B7339;
  --ok-bg: #E0F3E6;
  --warn: #9A5300;
  --warn-bg: #FCEFD9;
  --bad: #B0301D;
  --bad-bg: #FAE5E1;
  --tint-s: 52%;
  --tint-l: 90%;
  --paper: #FFFFFF;
  --paper-ink: #111418;
  --paper-muted: #4A535C;
  --paper-line: #8A949E;
  --paper-head: #EEF1F4;
  --shadow: 0 1px 2px rgba(22, 32, 42, .08), 0 2px 8px rgba(22, 32, 42, .05);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #11161C; --surface: #19202A; --surface-2: #1F2732; --free: #161C24;
    --ink: #E5EAF0; --muted: #96A2AE; --line: #2D3845; --line-strong: #3E4B5A; --grid: #1C242D; --outline-bg: #161D25;
    --accent: #84ABE6; --accent-ink: #0D1520; --accent-soft: #1E2E44;
    --pupil: #A3B8F4; --pupil-bg: #22305A; --pupil-line: #34477C;
    --staff: #84D6BA; --staff-bg: #153B31; --staff-line: #22584A;
    --ppa: #CCA6EE; --ppa-bg: #33244A; --off: #80CBE4; --off-bg: #163646;
    --ok: #82D49D; --ok-bg: #173825; --warn: #F0B866; --warn-bg: #3F2D0F; --bad: #F09C8D; --bad-bg: #481E18;
    --tint-s: 30%; --tint-l: 24%;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #11161C; --surface: #19202A; --surface-2: #1F2732; --free: #161C24;
  --ink: #E5EAF0; --muted: #96A2AE; --line: #2D3845; --line-strong: #3E4B5A; --grid: #1C242D; --outline-bg: #161D25;
  --accent: #84ABE6; --accent-ink: #0D1520; --accent-soft: #1E2E44;
  --pupil: #A3B8F4; --pupil-bg: #22305A; --pupil-line: #34477C;
  --staff: #84D6BA; --staff-bg: #153B31; --staff-line: #22584A;
  --ppa: #CCA6EE; --ppa-bg: #33244A; --off: #80CBE4; --off-bg: #163646;
  --ok: #82D49D; --ok-bg: #173825; --warn: #F0B866; --warn-bg: #3F2D0F; --bad: #F09C8D; --bad-bg: #481E18;
  --tint-s: 30%; --tint-l: 24%;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.4 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { text-wrap: balance; }

.app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
#view { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; color: var(--accent); flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.plan-name { border: 0; background: none; padding: 0; text-align: left; color: var(--muted); font-size: 12px; }
.plan-name:hover { color: var(--accent); text-decoration: underline; }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); }
.tab { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--muted); }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.save-state { font-size: 12px; color: var(--muted); }
.save-state.bad { color: var(--bad); font-weight: 600; }
.icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 0; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn svg { width: 16px; height: 16px; }

.btn { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; padding: 6px 11px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger.primary { background: var(--bad); color: var(--surface); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.due::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- Plan: slot strip ---------- */
.slotbar { display: flex; align-items: flex-end; gap: 10px 16px; flex-wrap: wrap; padding: 10px 16px 8px; }
.strip { display: flex; gap: 6px; flex-wrap: wrap; }
.strip-day { display: flex; flex-direction: column; gap: 3px; padding: 3px 5px 5px; border-radius: 8px; }
.strip-day.on { background: var(--accent-soft); }
.strip-dayname { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding-left: 2px; }
.strip-day.on .strip-dayname { color: var(--accent); }
.strip-periods { display: flex; gap: 3px; }
.strip-btn { width: 40px; height: 36px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0; line-height: 1.1; }
.strip-btn:hover { border-color: var(--accent); }
.strip-label { font-size: 12px; font-weight: 600; }
.strip-mark { font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; min-height: 12px; }
.strip-btn.empty .strip-mark { color: var(--muted); font-weight: 500; }
.strip-btn.done { border-color: var(--ok); }
.strip-btn.done .strip-mark { color: var(--ok); }
.strip-btn.todo .strip-mark { color: var(--warn); }
.strip-btn.alert { border-color: var(--bad); }
.strip-btn.alert .strip-mark { color: var(--bad); }
.strip-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 2px var(--accent-soft); }
.strip-btn.active .strip-mark { color: var(--accent-ink); }
.slot-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-left: auto; }

.editbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 16px 8px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--ink); border: 1px solid var(--warn); font-size: 13px; }
.editbar b { color: var(--warn); }

/* ---------- Plan: tray + map ---------- */
.plan { flex: 1; min-height: 460px; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 12px; padding: 0 16px 16px; }
.tray { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
.slot-name { display: flex; flex-direction: column; gap: 2px; padding: 2px 2px 0; }
.slot-name b { font-size: 17px; letter-spacing: -.01em; }
.slot-name span { font-size: 12px; color: var(--muted); }
.zone { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px 8px; display: flex; flex-direction: column; gap: 6px; }
.zone-head { display: flex; align-items: baseline; gap: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.zone-head .n { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.zone-body { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; min-height: 34px; padding: 5px; border-radius: 7px; border: 1px dashed var(--line-strong); background: var(--surface-2); }
.zone-body:empty::after { content: attr(data-empty); font-size: 12px; color: var(--muted); align-self: center; padding: 0 2px; }
.zone-sub { font-size: 10.5px; font-weight: 700; color: var(--muted); width: 100%; margin-top: 2px; }
.zone.off .zone-body { background: var(--off-bg); border-color: var(--off); }
.zone.ppa .zone-body { background: var(--ppa-bg); border-color: var(--ppa); }
.zone.off .zone-head { color: var(--off); }
.zone.ppa .zone-head { color: var(--ppa); }
.zone-title { width: 100%; font-size: 12.5px; font-weight: 600; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.checks { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.check { display: flex; gap: 6px; align-items: flex-start; padding: 5px 7px; border-radius: 7px; border: 0; text-align: left; width: 100%; line-height: 1.3; }
.check::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; background: currentColor; }
.check.bad { background: var(--bad-bg); color: var(--bad); }
.check.warn { background: var(--warn-bg); color: var(--warn); }
.check.info { background: var(--surface-2); color: var(--muted); }
.check.ok { background: var(--ok-bg); color: var(--ok); }
.check span { color: var(--ink); }
.hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
.hint kbd { font: 600 11px var(--font); padding: 0 4px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); }
.start-card { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.start-card b { font-size: 14px; }
.start-card .row { display: flex; gap: 6px; flex-wrap: wrap; }

.mapcol { position: relative; min-width: 0; min-height: 0; display: flex; }
.mapwrap { flex: 1; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background-color: var(--surface-2); }
.map { position: relative; min-width: 860px; min-height: 480px;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; }
.map-tools { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 6px; z-index: 5; }
.map-tools .btn { box-shadow: var(--shadow); }
.zoom { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.zoom button { width: 28px; height: 26px; border: 0; border-radius: 5px; background: transparent; font-weight: 700; font-size: 15px; color: var(--ink); }
.zoom button:hover:not(:disabled) { background: var(--surface-2); }
.zoom button:disabled { opacity: .35; cursor: default; }
.zoom span { font-size: 11.5px; font-variant-numeric: tabular-nums; min-width: 38px; text-align: center; color: var(--muted); }

.room { position: absolute; display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
.room.free { background: var(--free); border-style: dashed; box-shadow: none; }
.room.alert { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad-bg); }
.room.over { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn-bg); }
.room-head { display: flex; align-items: flex-start; gap: 4px; padding: 4px 5px 2px 6px; }
.room-name { flex: 1; min-width: 0; font-size: 11px; font-weight: 700; line-height: 1.15; overflow-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.room.free .room-name { color: var(--muted); }
.room-count { flex: none; margin-left: auto; display: inline-flex; gap: 3px; align-items: center; border: 1px solid var(--line); border-radius: 5px; background: var(--surface-2); padding: 0 4px; font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 16px; }
.room-count:hover { border-color: var(--accent); }
.room-count .cp { color: var(--pupil); }
.room-count .cs { color: var(--staff); }
.room-lesson { margin: 0 4px; min-width: 0; font-weight: 600; font-size: 11.5px; padding: 2px 5px; border: 1px solid transparent; border-radius: 5px; background: var(--surface-2); color: var(--ink); }
.room-lesson::placeholder { color: var(--muted); font-weight: 500; opacity: .8; }
.room-lesson:hover { border-color: var(--line); }
.room-lesson:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.room.free .room-lesson { background: transparent; }
.room.free .room-lesson::placeholder { color: transparent; }
.room.free:hover .room-lesson::placeholder, .room.free .room-lesson:focus::placeholder { color: var(--muted); }
.room-people { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 3px; padding: 4px 4px 5px; overflow: auto; }
.room.free .room-people:empty::after { content: "Free"; font-size: 10.5px; color: var(--muted); padding: 0 2px; }
.room-foot { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; padding: 2px 4px 3px 6px; }
.room-foot.bad { background: var(--bad-bg); color: var(--bad); }
.room-foot.warn { background: var(--warn-bg); color: var(--warn); }
.room-flag { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.room.flash, .zone.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

.chip { display: inline-flex; align-items: center; height: 22px; font-weight: 650; font-size: 12px; line-height: 1; padding: 0 7px; border-radius: 999px; border: 1px solid var(--pupil-line); background: var(--pupil-bg); color: var(--pupil); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; white-space: nowrap; }
.chip.staff { border-radius: 5px; border-color: var(--staff-line); background: var(--staff-bg); color: var(--staff); }
.chip:hover { border-color: currentColor; }
.chip.sel { background: var(--pupil); color: var(--surface); border-color: var(--pupil); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--pupil); }
.chip.staff.sel { background: var(--staff); border-color: var(--staff); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--staff); }
.chip.faded { opacity: .55; }
.chip.lifting { opacity: .3; }
.ghost { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; display: flex; gap: 3px; align-items: center; padding: 4px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
.ghost .more { font-size: 11px; font-weight: 700; color: var(--muted); padding: 0 4px; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none !important; }
.drop-ok { outline: 3px solid var(--accent) !important; outline-offset: -2px; }
.room.drop-ok, .zone.drop-ok .zone-body { background: var(--accent-soft) !important; }
.drop-no { outline: 3px solid var(--bad) !important; outline-offset: -2px; }

/* Free rooms, room use */
.room-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.room-pill { border: 1px dashed var(--line-strong); background: var(--free); color: var(--ink); border-radius: 6px; padding: 2px 7px; font-size: 11.5px; font-weight: 600; }
.room-pill:hover { border-color: var(--accent); border-style: solid; }
.map-tools .seg { box-shadow: var(--shadow); background: var(--surface); }
.room.use { overflow: hidden; }
.room.use::before { content: ""; position: absolute; inset: 0; background: var(--accent); opacity: calc(var(--use) * .32); pointer-events: none; }
.room.use > * { position: relative; }
.room.use.unused { border: 2px dashed var(--warn); background: var(--warn-bg); box-shadow: none; }
.room.use.staffonly { background: var(--free); border-style: dashed; box-shadow: none; color: var(--muted); }
.use-num { padding: 0 6px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.use-num b { font-size: 15px; color: var(--ink); }
.room.use.unused .use-num { color: var(--warn); font-weight: 700; }
.use-grid { display: grid; gap: 2px; padding: 5px 6px 6px; margin-top: auto; max-width: 96px; }
.use-cell { aspect-ratio: 1; min-width: 0; padding: 0; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--surface); }
.use-cell.on { background: var(--accent); border-color: var(--accent); }
.use-cell.now { outline: 2px solid var(--ink); outline-offset: 0; }
.use-list { display: flex; flex-direction: column; gap: 2px; }
.use-row { display: grid; grid-template-columns: minmax(0, 1fr) 56px 22px; align-items: center; gap: 6px; border: 0; background: transparent; padding: 3px 4px; border-radius: 5px; text-align: left; font-size: 12.5px; }
.use-row:hover { background: var(--surface-2); }
.use-row.none .use-name, .use-row.none .use-n { color: var(--warn); font-weight: 700; }
.use-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.use-n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.use-bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; vertical-align: middle; }
.use-row .use-bar { width: 100%; }
.use-bar i { display: block; height: 100%; background: var(--accent); }
.use-td .use-bar { width: 40px; margin-right: 6px; }
.week td.tot.muted { color: var(--muted); }

/* Floor plan picture and building outlines */
.map.has-plan { min-width: 0; min-height: 0; margin: 0 auto; background-image: none; background-color: var(--paper); }
.plan-img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; user-select: none; }
.outline { position: absolute; border: 2px solid var(--line-strong); border-radius: 6px; background: var(--outline-bg); pointer-events: none; }
.map.has-plan .outline { background: transparent; }
.outline-name { position: absolute; left: 8px; bottom: 5px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.plan.editing .outline { pointer-events: auto; cursor: move; touch-action: none; border-style: dashed; border-color: var(--warn); }
.outline.label { border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }
.label-text { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); text-align: center; line-height: 1.15; }
.map.has-plan .label-text { color: var(--paper-muted); text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper); }
.map.has-plan .outline-name { color: var(--paper-muted); }
.plan.editing .outline.label { border: 1px dashed var(--warn); border-radius: 4px; }
.outline.label .fade-ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.fade-ctl input { width: 90px; }

/* Layout editing */
.plan.editing .room { cursor: move; touch-action: none; user-select: none; }
.plan.editing .room-head { padding-right: 5px; }
.rename-pop { position: absolute; left: 3px; top: 3px; z-index: 30; width: max(100% - 6px, 160px); font-size: 12px; font-weight: 700; padding: 4px 7px; border: 2px solid var(--accent); border-radius: 6px; background: var(--surface); color: var(--ink); box-shadow: 0 6px 16px rgba(0, 0, 0, .2); cursor: text; }
.plan.editing .room-name, .plan.editing .label-text, .plan.editing .outline-name { cursor: text; }
.label-text.empty, .outline-name.empty { opacity: .55; font-style: italic; }
.outline.label .room-del { bottom: auto; left: auto; top: -9px; right: -9px; width: 16px; height: 16px; font-size: 12px; }
.room-del { position: absolute; bottom: 3px; left: 3px; width: 18px; height: 18px; display: grid; place-items: center; padding: 0; border-radius: 4px; border: 1px solid var(--bad); background: var(--surface); color: var(--bad); font-size: 13px; line-height: 1; }
.resize { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none;
  background: linear-gradient(135deg, transparent 50%, var(--warn) 50%); border-bottom-right-radius: 7px; }
.plan.editing .room { outline: 1px dashed var(--warn); }

/* ---------- Week overview ---------- */
.page { padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.page-head { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.page-head h2 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line-strong); }
.summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); }
.pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
details.issues { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
details.issues summary { cursor: pointer; font-weight: 600; font-size: 13px; }
.issue-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px; margin-top: 8px; }
.issue-list .check { cursor: pointer; }
.issue-list .check b { color: var(--ink); margin-right: 4px; font-weight: 700; white-space: nowrap; }
.table-scroll { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); max-height: calc(100vh - 220px); min-height: 240px; }
table.week { border-collapse: separate; border-spacing: 0; font-size: 11.5px; }
.week th, .week td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 6px; vertical-align: top; text-align: left; }
.week thead th { position: sticky; top: 0; z-index: 2; background: var(--surface-2); font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.week thead th .d { display: block; color: var(--ink); text-transform: uppercase; letter-spacing: .06em; min-height: 14px; }
.week tbody th { position: sticky; left: 0; z-index: 1; background: var(--surface); font-weight: 700; white-space: nowrap; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
.week thead th:first-child { left: 0; z-index: 3; }
.week .ds { border-left: 2px solid var(--line-strong); }
.week td { min-width: 82px; max-width: 128px; cursor: pointer; }
.week td:hover { background: var(--accent-soft); }
.week td.free { background: var(--free); }
.week td.free:hover { background: var(--accent-soft); }
.week tr.group th { background: var(--surface-2); text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; color: var(--muted); }
.week tr.group td { background: var(--surface-2); cursor: default; }
.c-title { display: block; font-weight: 700; }
.c-staff { display: block; color: var(--staff); }
.c-pupils { display: block; color: var(--pupil); }
.week td.place { background: hsl(var(--h) var(--tint-s) var(--tint-l)); }
.week td.place:hover { filter: brightness(.96); }
.week td.none { background: var(--warn-bg); color: var(--warn); font-weight: 700; text-align: center; }
.week td.out { color: var(--muted); text-align: center; }
.week td.ppa { background: var(--ppa-bg); color: var(--ppa); font-weight: 700; }
.week td.off { background: var(--off-bg); color: var(--off); }
.week td.tot { cursor: default; font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--surface); }
.week td.tot:hover { background: var(--surface); }
.tot.short { color: var(--warn); font-weight: 700; }

/* ---------- Timetables (print) ---------- */
.print-controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.print-controls label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.print-controls select { padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); }
.sheets { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.sheet { width: min(100%, 1040px); background: var(--paper); color: var(--paper-ink); border-radius: 4px; box-shadow: 0 2px 10px rgba(0, 0, 0, .14); padding: 26px 30px 20px; display: flex; flex-direction: column; gap: 12px; }
.sheet-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 3px solid var(--paper-ink); padding-bottom: 8px; }
.sheet-head h3 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
.sheet-head .sub { font-size: 14px; color: var(--paper-muted); }
.sheet-head .school { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--paper-muted); text-transform: uppercase; letter-spacing: .08em; }
table.tt { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
.tt th, .tt td { border: 1.5px solid var(--paper-line); padding: 7px 8px; vertical-align: top; text-align: left; }
.tt thead th { background: var(--paper-head); font-size: 14px; }
.tt tbody th { width: 92px; background: var(--paper-head); }
.tt tbody th small { display: block; font-weight: 500; color: var(--paper-muted); font-size: 11.5px; }
.tt td { height: 84px; }
.tt .t { display: block; font-weight: 700; font-size: 15px; line-height: 1.2; }
.tt .w { display: block; font-size: 12.5px; font-weight: 600; margin-top: 3px; }
.tt .p { display: block; font-size: 12.5px; color: var(--paper-muted); margin-top: 2px; }
.tt .na { color: var(--paper-muted); font-style: italic; }
.tt .gap { color: var(--paper-muted); }
.sheet-foot { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--paper-muted); flex-wrap: wrap; }
.sheet.day .tt td { height: auto; min-height: 50px; }
.sheet.day .tt tbody th { width: 150px; }

/* ---------- Setup ---------- */
.setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 14px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { margin: 0; font-size: 15px; display: flex; align-items: baseline; gap: 8px; }
.card h3 .n { font-size: 12px; font-weight: 600; color: var(--muted); }
.card p { margin: 0; }
.card.wide { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; }
.field input { font-weight: 400; }
.txt { padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); min-width: 0; width: 100%; font-size: 13.5px; }
.txt:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.txt.sm { padding: 3px 6px; font-size: 13px; }
.edit-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.edit-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 0 4px 4px; }
.edit-table td { padding: 3px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
.edit-table td.num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; white-space: nowrap; }
.table-box { max-height: 460px; overflow: auto; }
.days-in { display: inline-flex; gap: 2px; }
.days-in button { width: 24px; height: 24px; padding: 0; border-radius: 5px; font-size: 11px; font-weight: 700; border: 1px solid var(--line-strong); background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.days-in button.part { background: linear-gradient(135deg, var(--accent) 50%, var(--surface) 50%); color: var(--ink); }
.days-in button.out { background: var(--surface); color: var(--muted); border-color: var(--line-strong); text-decoration: line-through; }
.x-btn { width: 26px; height: 26px; padding: 0; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; }
.x-btn:hover { border-color: var(--bad); color: var(--bad); }
.add-box { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
.add-box textarea { resize: vertical; min-height: 54px; }
.add-box .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.files { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.file-act { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); }
.file-act p { font-size: 12.5px; color: var(--muted); }

/* ---------- Dialogs and toasts ---------- */
dialog.dlg { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--ink); width: min(520px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0, 0, 0, .25); }
dialog.dlg.wide { width: min(720px, calc(100vw - 32px)); }
dialog.dlg::backdrop { background: rgba(10, 16, 24, .45); }
.dlg form { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px 16px; }
.dlg-title { margin: 0; font-size: 17px; }
.dlg-body { display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; }
.dlg-body p { margin: 0; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding-top: 4px; }
.pick-grid { border-collapse: collapse; font-size: 12.5px; }
.pick-grid th, .pick-grid td { padding: 4px 8px; text-align: center; }
.pick-grid th:first-child { text-align: left; }
.pick-grid input { width: 16px; height: 16px; }
.choice { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice small { display: block; color: var(--muted); }
.toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 2000; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 9px; font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); transition: opacity .3s, transform .3s; }
.toast.out { opacity: 0; transform: translateY(6px); }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }

@media (max-width: 760px) {
  .plan { flex: none; grid-template-columns: 1fr; }
  .tray { max-height: 320px; }
  .mapcol { height: 560px; }
  .top-actions { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Printing ---------- */
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  html, body { height: auto; background: #fff; color: #000; }
  .topbar, .page-head, .print-controls, .print-hint, .toasts { display: none !important; }
  .app, #view { display: block; height: auto; overflow: visible; }
  .page { padding: 0; }
  .sheets { display: block; }
  .sheet { width: auto; box-shadow: none; border-radius: 0; padding: 0; break-after: page; page-break-after: always; break-inside: avoid; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
  .tt th, .tt td { border-color: #555; }
  body:not([data-view="print"]) #view > * { display: none !important; }
  body:not([data-view="print"]) #view::before { content: "To print timetables, open the Timetables tab and print from there."; font: 16px sans-serif; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main id="view"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="file-open" accept=".json,.csv,application/json,text/csv" hidden>
<input type="file" id="image-open" accept="image/*" hidden>

<script>
(function () {
  'use strict';

  // ---------- Constants ----------
  const APP_ID = 'lifehouse-timetabler';
  const FILE_VERSION = 2;
  const STORE_KEY = 'lifehouse_timetabler_v2';
  const UI_KEY = 'lifehouse_timetabler_ui';
  const OLD_KEYS = ['lifehouse_map_v1', 'lifehouse_simple_grid_v1', 'lifehouse_min_export_v1'];
  const DAYS = [
    { id: 'Mon', name: 'Monday' }, { id: 'Tue', name: 'Tuesday' }, { id: 'Wed', name: 'Wednesday' },
    { id: 'Thu', name: 'Thursday' }, { id: 'Fri', name: 'Friday' }
  ];
  // Places that are not rooms on the map. A person with no entry in a period is "not placed yet".
  const NONE = 'NONE', OFF = 'OFF', PPA = 'PPA', OUT = 'OUT';
  const ZOOMS = [1, 1.25, 1.5, 1.75, 2];

  // The room layout from the saved map, in percent of the map's width and height.
  const DEFAULT_AREAS = [
    ['A1', 'Central Learning Space', 42.79, 41.9, 6.04, 24.39],
    ['A2', 'Creation Station', 50.47, 21.53, 6, 19.85],
    ['A3', 'North Classroom', 42.84, 15.59, 7.34, 25.62],
    ['A4', 'South Classroom', 43.03, 67.37, 10.29, 27.22],
    ['A5', 'Garden', 55.43, 0, 9.96, 20.02],
    ['A6', 'Kitchen', 33.15, 40.75, 6.13, 22.12],
    ['A7', 'Village Hall Kitchen', 17.38, 31.57, 7.11, 29.2],
    ['A8', 'Stables', 10.36, 63.74, 6.98, 27.63],
    ['A9', 'Woods', 1.06, 64.09, 7.08, 31.47],
    ['A10', 'Conference Room', 17.07, 4.11, 7.67, 22.29],
    ['A11', 'Literacy Lounge', 3.59, 1.13, 10.87, 29.29],
    ['A12', 'Hall', 1.47, 31.55, 15.38, 29.11],
    ['A13', 'The Dungeon', 31.24, 65.99, 8.58, 23.78],
    ['A14', 'DT area', 69.01, 1.74, 10.51, 18.1],
    ['A15', 'Science', 71.47, 23.24, 7.08, 22.38],
    ['A16', 'Little room', 91.38, 2.33, 6.1, 21.94],
    ['A17', 'Small Animals', 91.05, 47, 6.85, 23.43],
    ['A18', 'Pod', 71.88, 74.63, 6, 22.37],
    ['A19', 'Office', 87.21, 72.97, 6.72, 25.44],
    ['A20', 'Reception', 79.54, 73.49, 6.53, 25],
    ['A21', 'East Room', 81.99, 46.98, 7.18, 22.25],
    ['A22', 'Brook Room', 80.46, 16.47, 9.69, 26.97]
  ].map(([id, name, x, y, w, h]) => ({ id, name, x, y, w, h, cap: null, teach: id !== 'A19' && id !== 'A20' }));

  // ---------- Small helpers ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const str = (v) => (v == null ? '' : String(v)).trim();
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const num = (v, d) => (Number.isFinite(+v) ? +v : d);
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
  const nowIso = () => new Date().toISOString();

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (sk.startsWith('--')) el.style.setProperty(sk, String(sv)); else el.style[sk] = sv;
          }
        }
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'value') el.value = v;
        else if (k === 'checked' || k === 'disabled' || k === 'selected') el[k] = !!v;
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  function svg(markup) {
    const t = document.createElement('template');
    t.innerHTML = markup.trim();
    return t.content.firstChild;
  }
  const ICONS = {
    undo: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3.5 2.5 6.5l3 3"/><path d="M2.5 6.5h7a4 4 0 0 1 0 8h-2"/></svg>',
    redo: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 3.5 3 3-3 3"/><path d="M13.5 6.5h-7a4 4 0 0 0 0 8h2"/></svg>',
    mark: '<svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="4"/><path d="M2 13h11V2M13 30V20h17M20 2v11h10"/><circle cx="7.5" cy="20.5" r="2" fill="currentColor" stroke="none"/><circle cx="24" cy="7" r="2" fill="currentColor" stroke="none"/></svg>'
  };
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function fmtTime(d) { return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }

  // ---------- State ----------
  let project = null;
  const ui = Object.assign({ view: 'plan', day: 'Mon', period: null, zoom: 1, weekMode: 'room', mapMode: 'people', printWhat: 'student', printWho: 'all', printTimes: true }, loadUI());
  const sel = new Set();
  let editLayout = false;
  let undoStack = [], redoStack = [];
  let lastMerge = null, lastMergeAt = 0;
  let peopleById = new Map(), areaById = new Map(), statusCache = new Map(), useCache = new Map();
  const images = new Map();

  function rememberImage(dataUrl) {
    let hash = 5381;
    for (let i = 0; i < dataUrl.length; i += 7) hash = ((hash * 33) ^ dataUrl.charCodeAt(i)) >>> 0;
    const id = 'img' + dataUrl.length.toString(36) + hash.toString(36);
    images.set(id, dataUrl);
    return id;
  }
  // The plan as it is saved and backed up, with the floor plan picture put back in.
  function exportProject() {
    const out = Object.assign({}, project);
    const m = project.map;
    out.map = { image: m.imageId ? images.get(m.imageId) || null : null, w: m.w, h: m.h, fade: m.fade };
    return out;
  }
  let storageOk = true, lastSavedAt = null, saveTimer = null;
  let mapScroll = { left: 0, top: 0 };

  function loadUI() {
    try { return JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveUI() {
    try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (e) { /* not essential */ }
  }

  function blankProject() {
    return {
      app: APP_ID, version: FILE_VERSION, name: '', school: 'Lifehouse',
      periods: [1, 2, 3, 4].map((n) => ({ id: 'P' + n, label: 'P' + n, time: '' })),
      areas: clone(DEFAULT_AREAS), people: [], slots: {}, outlines: [],
      map: { imageId: null, w: 0, h: 0, fade: 0.55 },
      meta: { created: nowIso(), changedAt: null, backedUpAt: null }
    };
  }

  // Makes any loaded data safe to use: fills gaps, drops broken references.
  function sanitize(p) {
    const base = blankProject();
    if (!p || typeof p !== 'object') return base;
    const out = { app: APP_ID, version: FILE_VERSION, name: str(p.name), school: str(p.school) || 'Lifehouse' };

    const seenP = new Set();
    out.periods = (Array.isArray(p.periods) ? p.periods : []).map((x, i) => {
      let id = str(x && x.id) || 'P' + (i + 1);
      while (seenP.has(id)) id += '_';
      seenP.add(id);
      return { id, label: str(x && x.label) || id, time: str(x && x.time) };
    });
    if (!out.periods.length) out.periods = base.periods;

    const seenA = new Set();
    out.areas = (Array.isArray(p.areas) ? p.areas : base.areas).filter((a) => a && str(a.id) && !seenA.has(str(a.id)) && seenA.add(str(a.id))).map((a) => {
      const w = clamp(num(a.w, 10), 3, 100), hh = clamp(num(a.h, 15), 4, 100);
      return {
        id: str(a.id), name: str(a.name) || 'Room',
        x: clamp(num(a.x, 5), 0, 100 - w), y: clamp(num(a.y, 5), 0, 100 - hh), w, h: hh,
        cap: +a.cap > 0 ? Math.round(+a.cap) : null, teach: a.teach !== false
      };
    });

    const seenO = new Set();
    out.outlines = (Array.isArray(p.outlines) ? p.outlines : []).filter((o) => o && str(o.id) && !seenO.has(str(o.id)) && seenO.add(str(o.id))).map((o) => {
      const w = clamp(num(o.w, 20), 3, 100), hh = clamp(num(o.h, 20), 3, 100);
      return { id: str(o.id), kind: o.kind === 'label' ? 'label' : 'box', name: str(o.name), x: clamp(num(o.x, 0), 0, 100 - w), y: clamp(num(o.y, 0), 0, 100 - hh), w, h: hh };
    });
    // The floor plan picture is kept outside the plan's data (see rememberImage) so undo stays light.
    const m0 = p.map || {};
    let imageId = null;
    if (typeof m0.image === 'string' && m0.image.startsWith('data:image/')) imageId = rememberImage(m0.image);
    else if (m0.imageId && images.has(m0.imageId)) imageId = m0.imageId;
    out.map = imageId && +m0.w > 0 && +m0.h > 0
      ? { imageId, w: +m0.w, h: +m0.h, fade: clamp(num(m0.fade, 0.55), 0.1, 1) }
      : { imageId: null, w: 0, h: 0, fade: 0.55 };

    const seenPeople = new Set();
    out.people = (Array.isArray(p.people) ? p.people : []).filter((x) => x && str(x.id) && str(x.name) && !seenPeople.has(str(x.id)) && seenPeople.add(str(x.id))).map((x) => ({
      id: str(x.id), name: str(x.name), full: str(x.full),
      role: x.role === 'staff' ? 'staff' : 'student',
      ppa: Math.max(0, Math.round(num(x.ppa, 0)))
    }));

    const areaIds = new Set(out.areas.map((a) => a.id));
    const roleOf = new Map(out.people.map((x) => [x.id, x.role]));
    const dayIds = new Set(DAYS.map((d) => d.id));
    const periodIds = new Set(out.periods.map((x) => x.id));
    out.slots = {};
    for (const [key, s] of Object.entries(p.slots && typeof p.slots === 'object' ? p.slots : {})) {
      const [d, per] = key.split('|');
      if (!dayIds.has(d) || !periodIds.has(per) || !s) continue;
      const titles = {}, at = {};
      for (const [aid, t] of Object.entries(s.titles || {})) if ((areaIds.has(aid) || aid === OFF) && str(t)) titles[aid] = String(t);
      for (const [pid, place] of Object.entries(s.at || {})) {
        if (!roleOf.has(pid)) continue;
        if (place === PPA && roleOf.get(pid) !== 'staff') continue;
        if (areaIds.has(place) || place === OFF || place === PPA || place === OUT) at[pid] = place;
      }
      if (Object.keys(titles).length || Object.keys(at).length) out.slots[key] = { titles, at };
    }
    const m = p.meta || {};
    out.meta = { created: m.created || nowIso(), changedAt: m.changedAt || null, backedUpAt: m.backedUpAt || null };
    return out;
  }

  // Converts the earlier map/grid prototypes' saved state (P1–P4, no days) into this format.
  function fromOldFormat(old) {
    const p = blankProject();
    if (Array.isArray(old.areas) && old.areas.length) {
      p.areas = old.areas.map((a) => ({ id: a.id, name: a.name, x: a.x, y: a.y, w: a.w, h: a.h, cap: null }));
    }
    if (Array.isArray(old.people)) p.people = old.people.map((x) => ({ id: x.id, name: x.name, role: x.role }));
    const periodIds = Object.keys(old.assignments || {});
    if (periodIds.length) p.periods = periodIds.map((id) => ({ id, label: id, time: '' }));
    for (const pid of periodIds) {
      const snap = old.assignments[pid] || {};
      const s = { titles: {}, at: {} };
      for (const [aid, ids] of Object.entries(snap.byArea || {})) (ids || []).forEach((id) => { s.at[id] = aid; });
      (snap.ppa || []).forEach((id) => { s.at[id] = PPA; });
      for (const [aid, t] of Object.entries((old.lessonTitles || {})[pid] || {})) if (str(t)) s.titles[aid] = t;
      p.slots['Mon|' + pid] = s;
    }
    return p;
  }

  // ---------- Reading the timetable ----------
  const slotKey = (day, period) => day + '|' + period;
  const curKey = () => slotKey(ui.day, ui.period);
  const EMPTY_SLOT = Object.freeze({ titles: Object.freeze({}), at: Object.freeze({}) });
  function slotOf(key, create) {
    let s = project.slots[key];
    if (!s && create) s = project.slots[key] = { titles: {}, at: {} };
    return s || EMPTY_SLOT;
  }
  const person = (id) => peopleById.get(id);
  const isStaff = (p) => p.role === 'staff';
  const isPupil = (p) => p.role !== 'staff';
  const pupils = () => project.people.filter(isPupil);
  const staff = () => project.people.filter(isStaff);
  const names = (list) => list.map((p) => p.name).join(', ');
  const dayName = (id) => (DAYS.find((d) => d.id === id) || {}).name || id;
  const periodOf = (id) => project.periods.find((p) => p.id === id) || { id, label: id, time: '' };
  function placeName(id) {
    if (id === OFF) return 'Off-site';
    if (id === PPA) return 'PPA';
    if (id === OUT) return 'Not in';
    if (!id || id === NONE) return 'Not placed';
    const a = areaById.get(id);
    return a ? a.name : '?';
  }
  function peopleAt(s, place) { return project.people.filter((p) => s.at[p.id] === place); }
  function slotLabel(key) {
    const [d, per] = key.split('|');
    return d + ' ' + periodOf(per).label;
  }
  function areaHue(id) {
    const i = project.areas.findIndex((a) => a.id === id);
    return Math.round((i * 137.508) % 360);
  }

  function slotStatus(key) {
    if (statusCache.has(key)) return statusCache.get(key);
    const s = slotOf(key);
    const counts = {};
    let started = false;
    for (const p of project.people) {
      const pl = s.at[p.id];
      if (!pl) continue;
      if (pl !== OUT) started = true;
      const c = counts[pl] || (counts[pl] = { p: 0, s: 0 });
      if (isStaff(p)) c.s++; else c.p++;
    }
    if (Object.values(s.titles).some((t) => str(t))) started = true;
    const unplacedPupils = project.people.filter((p) => isPupil(p) && !s.at[p.id]);
    const unplacedStaff = project.people.filter((p) => isStaff(p) && !s.at[p.id]);
    const issues = [];
    let noStaff = 0;
    const places = project.areas.map((a) => ({ id: a.id, name: a.name, cap: a.cap })).concat([{ id: OFF, name: 'Off-site', cap: null }]);
    for (const pl of places) {
      const c = counts[pl.id];
      if (!c) continue;
      if (c.p > 0 && c.s === 0) { noStaff++; issues.push({ level: 'bad', text: pl.name + ': ' + plural(c.p, 'pupil') + ', no staff', zone: pl.id }); }
      if (pl.cap && c.p > pl.cap) issues.push({ level: 'warn', text: pl.name + ': ' + c.p + ' pupils, room for ' + pl.cap, zone: pl.id });
    }
    if (unplacedPupils.length) issues.push({ level: 'warn', text: 'Not placed: ' + names(unplacedPupils), zone: NONE });
    if (unplacedStaff.length) issues.push({ level: 'info', text: 'Staff not placed: ' + names(unplacedStaff), zone: NONE });
    let state = 'empty';
    if (started) state = noStaff ? 'alert' : issues.some((i) => i.level === 'warn') ? 'todo' : 'done';
    const st = { key, started, counts, unplacedPupils, unplacedStaff, issues, noStaff, state };
    statusCache.set(key, st);
    return st;
  }
  function allSlotKeys() {
    const keys = [];
    for (const d of DAYS) for (const p of project.periods) keys.push(slotKey(d.id, p.id));
    return keys;
  }
  // The periods in the week when a room has pupils in it.
  function roomUse(areaId) {
    if (useCache.has(areaId)) return useCache.get(areaId);
    const keys = allSlotKeys();
    const used = new Set(keys.filter((k) => { const s = slotOf(k); return project.people.some((p) => isPupil(p) && s.at[p.id] === areaId); }));
    const u = { used, n: used.size, total: keys.length };
    useCache.set(areaId, u);
    return u;
  }
  function ppaCount(pid) {
    return allSlotKeys().filter((k) => slotOf(k).at[pid] === PPA).length;
  }

  // ---------- Changing the timetable (with undo) ----------
  function pushUndo() {
    undoStack.push(JSON.stringify(project));
    if (undoStack.length > 150) undoStack.shift();
    redoStack = [];
  }
  function mutate(fn, opts = {}) {
    const t = Date.now();
    const merge = opts.merge && opts.merge === lastMerge && t - lastMergeAt < 2500;
    if (!merge) pushUndo();
    lastMerge = opts.merge || null;
    lastMergeAt = t;
    const result = fn(project);
    if (result && result.app === APP_ID) project = result;
    markChanged();
    if (opts.render === false) { rebuildIndexes(); renderTopbar(); }
    else render();
  }
  function markChanged() {
    project.meta.changedAt = nowIso();
    scheduleSave();
  }
  function undo() {
    if (!undoStack.length) { toast('Nothing to undo'); return; }
    redoStack.push(JSON.stringify(project));
    project = sanitize(JSON.parse(undoStack.pop()));
    lastMerge = null; sel.clear();
    markChanged(); render();
  }
  function redo() {
    if (!redoStack.length) { toast('Nothing to redo'); return; }
    undoStack.push(JSON.stringify(project));
    project = sanitize(JSON.parse(redoStack.pop()));
    lastMerge = null; sel.clear();
    markChanged(); render();
  }

  function placeMany(ids, zone) {
    const valid = ids.filter((id) => { const p = person(id); return p && !(zone === PPA && !isStaff(p)); });
    const rejected = ids.length - valid.length;
    if (!valid.length) { toast('PPA is for staff only'); return; }
    const key = curKey();
    sel.clear();
    mutate(() => {
      const s = slotOf(key, true);
      valid.forEach((id) => { if (zone === NONE) delete s.at[id]; else s.at[id] = zone; });
    });
    if (rejected) toast(plural(rejected, 'pupil') + ' left where they were: PPA is for staff only');
  }
  function setTitle(place, value) {
    const key = curKey();
    mutate(() => {
      const s = slotOf(key, true);
      if (str(value)) s.titles[place] = value; else delete s.titles[place];
    }, { merge: 'title|' + key + '|' + place, render: false });
  }
  // Copies one period onto another. People marked "not in" at the target stay not in.
  function copySlotInto(srcKey, dstKey) {
    const src = slotOf(srcKey), dst = slotOf(dstKey, true);
    const at = {};
    let skipped = 0;
    for (const [id, place] of Object.entries(dst.at)) if (place === OUT) at[id] = OUT;
    for (const [id, place] of Object.entries(src.at)) {
      if (place === OUT) continue;
      if (at[id] === OUT) { skipped++; continue; }
      at[id] = place;
    }
    dst.at = at;
    dst.titles = Object.assign({}, src.titles);
    return skipped;
  }
  function clearSlot(key) {
    const s = slotOf(key, true);
    const at = {};
    for (const [id, place] of Object.entries(s.at)) if (place === OUT) at[id] = OUT;
    s.at = at;
    s.titles = {};
  }

  // ---------- Saving ----------
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 250);
  }
  function saveNow() {
    clearTimeout(saveTimer);
    saveTimer = null;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(exportProject()));
      storageOk = true;
      lastSavedAt = new Date();
    } catch (e) {
      storageOk = false;
    }
    renderSaveState();
  }
  window.addEventListener('pagehide', () => { if (saveTimer) saveNow(); });
  window.addEventListener('beforeunload', () => { if (saveTimer) saveNow(); });
  // If the same file is open in another tab, follow its changes instead of overwriting them.
  window.addEventListener('storage', (e) => {
    if (e.key !== STORE_KEY || !e.newValue) return;
    try {
      project = sanitize(JSON.parse(e.newValue));
      undoStack = []; redoStack = []; sel.clear();
      render();
      toast('Updated with changes made in another window');
    } catch (err) { /* ignore */ }
  });

  function backupDue() {
    const m = project.meta;
    return !!(m.changedAt && (!m.backedUpAt || m.changedAt > m.backedUpAt) && (project.people.length || Object.keys(project.slots).length));
  }
  function fileSafe(s) { return s.replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim(); }
  function download(filename, text, mime) {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: filename });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  function saveBackup() {
    const stamp = new Date();
    const d = stamp.getFullYear() + '-' + String(stamp.getMonth() + 1).padStart(2, '0') + '-' + String(stamp.getDate()).padStart(2, '0') + ' ' + String(stamp.getHours()).padStart(2, '0') + String(stamp.getMinutes()).padStart(2, '0');
    project.meta.backedUpAt = nowIso();
    const name = fileSafe((project.school || 'School') + ' timetable backup - ' + (project.name || 'plan') + ' - ' + d) + '.json';
    download(name, JSON.stringify(exportProject(), null, 1), 'application/json');
    saveNow();
    renderTopbar();
    toast('Backup saved as “' + name + '”. Keep it somewhere safe, like a shared drive.');
  }

  // ---------- Opening files ----------
  const fileInput = $('#file-open');
  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => openText(String(reader.result || ''), f.name);
    reader.onerror = () => toast('That file could not be read.');
    reader.readAsText(f);
  });
  function openFilePicker() { fileInput.click(); }
  const imageInput = $('#image-open');
  imageInput.addEventListener('change', () => {
    const f = imageInput.files && imageInput.files[0];
    imageInput.value = '';
    if (f) loadPicture(f);
  });

  function openText(text, filename) {
    const t = text.replace(/^﻿/, '').trim();
    if (/\.csv$/i.test(filename) || !/^[{[]/.test(t)) { importPeopleCsv(t, filename); return; }
    let obj;
    try { obj = JSON.parse(t); } catch (e) { toast('“' + filename + '” is not a timetable backup.'); return; }
    let incoming = null, what = '';
    if (obj && (obj.app === APP_ID || obj.slots)) { incoming = sanitize(obj); what = 'backup'; }
    else if (obj && obj.assignments && obj.areas) { incoming = sanitize(fromOldFormat(obj)); what = 'old'; }
    if (!incoming) { toast('“' + filename + '” is not a timetable backup.'); return; }
    const filled = Object.values(incoming.slots).reduce((n, s) => n + Object.values(s.at).filter((v) => v !== OUT).length, 0);
    dialog({
      title: 'Open “' + filename + '”?',
      body: [
        h('p', null, (incoming.name ? '“' + incoming.name + '”: ' : '') + plural(incoming.areas.length, 'room') + ', ' + plural(incoming.people.filter(isPupil).length, 'pupil') + ', ' + plural(incoming.people.filter(isStaff).length, 'member') + ' of staff, ' + plural(filled, 'placement') + '.'),
        what === 'old' ? h('p', null, 'This is from the earlier version, which had no days. Its placements will go into Monday.') : null,
        h('p', { class: 'hint' }, 'This replaces what is on screen now. You can undo it straight after.')
      ],
      actions: [{ label: 'Cancel' }, { label: 'Open it', kind: 'primary', run: () => {
        mutate(() => incoming);
        if (!project.periods.some((p) => p.id === ui.period)) ui.period = project.periods[0].id;
        render();
        toast('Opened “' + filename + '”');
      } }]
    });
  }

  function parseCsv(text) {
    const rows = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((r) => r.some((c) => str(c)));
  }
  // Reads a people list such as the handover pack's people.csv (columns: name, role, optional full name).
  function importPeopleCsv(text, filename) {
    const rows = parseCsv(text);
    if (!rows.length) { toast('“' + filename + '” is empty.'); return; }
    const head = rows[0].map((c) => str(c).toLowerCase());
    let iName = head.findIndex((c) => c === 'name' || c === 'initials' || c === 'short name');
    let iRole = head.findIndex((c) => c === 'role' || c === 'type');
    let iFull = head.findIndex((c) => c === 'full name' || c === 'full_name' || c === 'fullname');
    let body = rows.slice(1);
    if (iName < 0) { iName = 0; iRole = rows[0].length > 1 ? 1 : -1; body = rows; }
    const list = body.map((r) => ({
      name: str(r[iName]),
      role: iRole >= 0 && /staff|teacher|adult|ta\b|lsa|tutor/i.test(str(r[iRole])) ? 'staff' : 'student',
      full: iFull >= 0 ? str(r[iFull]) : ''
    })).filter((x) => x.name);
    if (!list.length) { toast('No names found in “' + filename + '”.'); return; }
    addPeople(list);
  }
  function nextId(prefix, taken) {
    let n = 1;
    while (taken.has(prefix + String(n).padStart(2, '0'))) n++;
    const id = prefix + String(n).padStart(2, '0');
    taken.add(id);
    return id;
  }
  function addPeople(list) {
    const have = new Set(project.people.map((p) => p.role + '|' + p.name.toLowerCase()));
    const fresh = [];
    let skipped = 0;
    for (const x of list) {
      const k = x.role + '|' + x.name.toLowerCase();
      if (have.has(k)) { skipped++; continue; }
      have.add(k);
      fresh.push(x);
    }
    if (!fresh.length) { toast(skipped ? 'Everyone on that list is already here.' : 'No names to add.'); return; }
    mutate((p) => {
      const taken = new Set(p.people.map((x) => x.id));
      fresh.forEach((x) => p.people.push({ id: nextId(x.role === 'staff' ? 'T' : 'S', taken), name: x.name, full: x.full || '', role: x.role, ppa: 0 }));
    });
    const np = fresh.filter((x) => x.role !== 'staff').length, ns = fresh.length - np;
    toast('Added ' + [np ? plural(np, 'pupil') : '', ns ? plural(ns, 'member') + ' of staff' : ''].filter(Boolean).join(' and ') + (skipped ? ' (' + skipped + ' already here)' : ''));
  }

  // ---------- Exports ----------
  function csvCell(v) {
    const s = String(v == null ? '' : v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function csvText(rows) { return '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n'; }
  function lessonFor(s, place) {
    if (place === PPA) return 'PPA';
    if (place === OUT || !place) return '';
    return s.titles[place] || '';
  }
  function exportAllocations() {
    const rows = [['Day', 'Period', 'Time', 'Place', 'Lesson', 'Name', 'Full name', 'Role', 'Staff with them']];
    for (const d of DAYS) for (const per of project.periods) {
      const s = slotOf(slotKey(d.id, per.id));
      for (const p of project.people) {
        const place = s.at[p.id];
        const withStaff = place && place !== OUT && place !== PPA ? names(peopleAt(s, place).filter((x) => isStaff(x) && x.id !== p.id)) : '';
        rows.push([d.name, per.label, per.time, placeName(place), lessonFor(s, place), p.name, p.full, isStaff(p) ? 'Staff' : 'Pupil', withStaff]);
      }
    }
    download(fileSafe((project.school || 'School') + ' timetable - ' + (project.name || 'plan') + ' - by person and period') + '.csv', csvText(rows), 'text/csv;charset=utf-8');
  }
  function exportGrid() {
    const keys = allSlotKeys();
    const rows = [['Name', 'Role'].concat(keys.map((k) => slotLabel(k)))];
    for (const p of project.people) {
      rows.push([p.name, isStaff(p) ? 'Staff' : 'Pupil'].concat(keys.map((k) => {
        const s = slotOf(k), place = s.at[p.id];
        if (!place) return '';
        const t = lessonFor(s, place);
        return placeName(place) + (t && place !== PPA ? ': ' + t : '');
      })));
    }
    download(fileSafe((project.school || 'School') + ' timetable - ' + (project.name || 'plan') + ' - week grid') + '.csv', csvText(rows), 'text/csv;charset=utf-8');
  }

  // ---------- Dialogs and toasts ----------
  function dialog({ title, body, actions, wide }) {
    const dlg = h('dialog', { class: 'dlg' + (wide ? ' wide' : '') });
    const close = () => { if (dlg.open) dlg.close(); };
    const form = h('form', { onsubmit: (e) => e.preventDefault() },
      h('h2', { class: 'dlg-title' }, title),
      h('div', { class: 'dlg-body' }, body),
      h('div', { class: 'dlg-actions' }, actions.map((a) => h('button', {
        type: a.kind && a.kind.includes('primary') ? 'submit' : 'button',
        class: 'btn ' + (a.kind || ''),
        onclick: (e) => { e.preventDefault(); if (a.run && a.run(dlg) === false) return; close(); }
      }, a.label))));
    dlg.append(form);
    dlg.addEventListener('close', () => dlg.remove());
    document.body.append(dlg);
    dlg.showModal();
    const first = dlg.querySelector('input:not([type=checkbox]):not([type=radio]), textarea');
    if (first) first.focus();
    return dlg;
  }
  function confirmBox(title, text, okLabel, run, danger) {
    dialog({ title, body: h('p', null, text), actions: [{ label: 'Cancel' }, { label: okLabel, kind: danger ? 'danger primary' : 'primary', run }] });
  }
  function toast(msg, action) {
    const box = $('#toasts');
    const t = h('div', { class: 'toast', role: 'status' }, h('span', null, msg),
      action ? h('button', { type: 'button', onclick: () => { action.run(); t.remove(); } }, action.label) : null);
    box.append(t);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => t.classList.add('out'), 4200);
    setTimeout(() => t.remove(), 4600);
  }

  // ---------- Rendering ----------
  function rebuildIndexes() {
    peopleById = new Map(project.people.map((p) => [p.id, p]));
    areaById = new Map(project.areas.map((a) => [a.id, a]));
    statusCache = new Map();
    useCache = new Map();
    if (!project.periods.some((p) => p.id === ui.period)) ui.period = project.periods[0].id;
    if (!DAYS.some((d) => d.id === ui.day)) ui.day = 'Mon';
    for (const id of [...sel]) if (!peopleById.has(id)) sel.delete(id);
  }

  function render() {
    rebuildIndexes();
    document.body.dataset.view = ui.view;

  // A pop-out box for renaming a room, label or outline while arranging the map.

  function loadPicture(file) {

    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale)), hh = Math.max(1, Math.round(img.naturalHeight * scale));
        const c = document.createElement('canvas');
        c.width = w; c.height = hh;
        const g = c.getContext('2d');
        g.fillStyle = '#ffffff';
        g.fillRect(0, 0, w, hh);
        g.drawImage(img, 0, 0, w, hh);
        const id = rememberImage(c.toDataURL('image/jpeg', 0.82));
        mutate((p) => { p.map = { imageId: id, w, h: hh, fade: p.map.fade || 0.55 }; });
        toast('Floor plan added. Drag each room onto its place on the picture.');
      };
      img.onerror = () => toast('That picture could not be opened. Try a JPG or PNG.');
      img.src = String(reader.result);
    };
    reader.readAsDataURL(file);
  }

  function exampleProject(layout) {
    const p = blankProject();

      p.outlines = clone(layout.outlines);

    }

    p.periods = [['P1', '9:30–10:30'], ['P2', '10:45–11:45'], ['P3', '12:30–1:30'], ['P4', '1:45–2:45']].map(([id, time]) => ({ id, label: id, time }));

    pupilNames.forEach((n, i) => p.people.push({ id: 'S' + String(i + 1).padStart(2, '0'), name: n, full: '', role: 'student', ppa: 0 }));
    staffNames.forEach((n, i) => p.people.push({ id: 'T' + String(i + 1).padStart(2, '0'), name: n, full: '', role: 'staff', ppa: ppaNeeds[n] || 0 }));

      A1: ['Maths', 'Maths', 'Topic', 'Reading'], A2: 'Art', A3: ['English', 'Maths', 'Topic', 'Life skills'], A4: ['Maths', 'English', 'Humanities', 'Games'],
      A5: 'Gardening', A6: 'Cooking', A7: 'Food tech', A8: 'Horse care', A9: 'Forest school', A10: 'Careers', A11: ['Phonics', 'Reading', 'Literacy', 'Story time'],
      A12: 'PE', A13: 'Music', A14: 'DT', A15: 'Science', A16: '1:1 work', A17: 'Animal care', A18: 'Regulation', A21: 'Sensory', A22: ['Numeracy', 'Literacy', 'Numeracy', 'PSHE']

    // How often each room tends to be chosen: some rooms are left quiet on purpose so "Room use" has something to show.

    for (const [day, per, pi] of keys) {
      const s = { titles: {}, at: {} };
      const out = new Set();
      if (day === 'Fri') out.add('T20');
      if (day === 'Wed' && pi >= 2) out.add('S20');
      out.forEach((id) => { s.at[id] = OUT; });
      let kids = shuffle(p.people.filter((x) => x.role === 'student' && !out.has(x.id)).map((x) => x.id));
      let adults = shuffle(p.people.filter((x) => x.role === 'staff' && !out.has(x.id)).map((x) => x.id));
      if (day === 'Fri' && per === 'P4') kids = kids.slice(3);

  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || ui.view !== 'plan') return;
    const base = { x0: e.clientX, y0: e.clientY, id: e.pointerId };
    if (editLayout) {
      const handle = e.target.closest('[data-resize]');
      const room = e.target.closest('.room, .outline');
      if (!room || (!handle && e.target.closest('input, button'))) return;
      const map = $('#map');
      const a = room.dataset.area ? areaById.get(room.dataset.area) : project.outlines.find((o) => o.id === room.dataset.outline);
      if (!a || !map) return;
      e.preventDefault();
      pushUndo();
      drag = Object.assign(base, { kind: handle ? 'resize' : 'move', area: a, el: room, rect: map.getBoundingClientRect(), orig: { x: a.x, y: a.y, w: a.w, h: a.h }, moved: false });
      return;
    }
    const c = e.target.closest('.chip');
    if (c) { drag = Object.assign(base, { kind: 'chip', pid: c.dataset.pid, started: false }); return; }
    const roomBtn = e.target.closest('[data-select-room]');
    if (roomBtn) { drag = Object.assign(base, { kind: 'tap', room: roomBtn.dataset.selectRoom }); return; }
    if (e.target.closest('input, button, textarea, select, a')) return;
    const z = e.target.closest('[data-zone]');
    if (z) drag = Object.assign(base, { kind: 'tap', zone: z.dataset.zone });
  });

  document.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dist = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
    if (drag.kind === 'tap') { if (dist > 8) drag = null; return; }
    if (drag.kind === 'chip') {
      if (!drag.started) {
        if (dist < 6) return;
        startChipDrag();
      }
      e.preventDefault();
      drag.ghost.style.transform = 'translate(' + (e.clientX + 10) + 'px,' + (e.clientY + 12) + 'px)';
      updateHover(e.clientX, e.clientY);
      autoScroll(e.clientX, e.clientY);
      return;
    }
    const dx = ((e.clientX - drag.x0) / drag.rect.width) * 100;
    const dy = ((e.clientY - drag.y0) / drag.rect.height) * 100;
    const a = drag.area, o = drag.orig;
    drag.moved = true;
    if (drag.kind === 'move') {
      a.x = round2(clamp(o.x + dx, 0, 100 - a.w));
      a.y = round2(clamp(o.y + dy, 0, 100 - a.h));
      drag.el.style.left = a.x + '%';
      drag.el.style.top = a.y + '%';
    } else {
      a.w = round2(clamp(o.w + dx, 3, 100 - a.x));
      a.h = round2(clamp(o.h + dy, 4, 100 - a.y));
      drag.el.style.width = a.w + '%';
      drag.el.style.height = a.h + '%';
    }
  });
  const round2 = (v) => Math.round(v * 100) / 100;

  function startChipDrag() {
    drag.started = true;
    drag.ids = sel.has(drag.pid) ? [...sel] : [drag.pid];
    const shown = drag.ids.slice(0, 3).map((id) => person(id)).filter(Boolean);
    drag.ghost = h('div', { class: 'ghost' }, shown.map((p) => chip(p)), drag.ids.length > 3 ? h('span', { class: 'more' }, '+' + (drag.ids.length - 3)) : null);
    document.body.append(drag.ghost);
    document.body.classList.add('dragging');
    drag.ids.forEach((id) => document.querySelectorAll('.chip[data-pid="' + id + '"]').forEach((el) => { if (!drag.ghost.contains(el)) el.classList.add('lifting'); }));
    const s = window.getSelection && window.getSelection();
    if (s) s.removeAllRanges();
  }
  function zoneFromPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    return el ? el.closest('[data-zone]') : null;
  }
  function updateHover(x, y) {
    const z = zoneFromPoint(x, y);
    if (drag.hover && drag.hover !== z) drag.hover.classList.remove('drop-ok', 'drop-no');
    drag.hover = z;
    if (z) {
      const bad = z.dataset.zone === PPA && drag.ids.every((id) => { const p = person(id); return p && !isStaff(p); });
      z.classList.toggle('drop-no', bad);
      z.classList.toggle('drop-ok', !bad);
    }
  }
  // Scrolls the map or the tray while a name is dragged near their edges.
  function autoScroll(x, y) {
    for (const box of [$('#mapwrap'), $('.tray')]) {
      if (!box) continue;
      const r = box.getBoundingClientRect();
      if (x < r.left || x > r.right || y < r.top - 20 || y > r.bottom + 20) continue;
      const edge = 40, step = 14;
      if (x < r.left + edge) box.scrollLeft -= step;
      else if (x > r.right - edge) box.scrollLeft += step;
      if (y < r.top + edge) box.scrollTop -= step;
      else if (y > r.bottom - edge) box.scrollTop += step;
    }
  }
  function toggleSelected(id) {
    if (sel.has(id)) sel.delete(id); else sel.add(id);
    document.querySelectorAll('.chip[data-pid="' + id + '"]').forEach((el) => {
      el.classList.toggle('sel', sel.has(id));
      el.setAttribute('aria-pressed', sel.has(id) ? 'true' : 'false');
    });
  }
  function pickUpRoom(areaId) {
    const ids = peopleAt(slotOf(curKey()), areaId).map((p) => p.id);
    const all = ids.every((id) => sel.has(id));
    sel.clear();
    if (!all) ids.forEach((id) => sel.add(id));
    render();
    if (!all) toast(plural(ids.length, 'person', 'people') + ' picked up. Tap a room, or drag one of them, to move them all.');
  }
  function endDrag(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    if (d.kind === 'tap') {
      if (cancelled) return;
      if (d.room) { pickUpRoom(d.room); return; }
      const z = zoneFromPoint(e.clientX, e.clientY);
      if (sel.size && z && z.dataset.zone === d.zone) placeMany([...sel], d.zone);
      return;
    }
    if (d.kind === 'chip') {
      if (!d.started) { if (!cancelled) toggleSelected(d.pid); return; }
      d.ghost.remove();
      document.body.classList.remove('dragging');
      document.querySelectorAll('.lifting').forEach((el) => el.classList.remove('lifting'));
      if (d.hover) d.hover.classList.remove('drop-ok', 'drop-no');
      const z = cancelled ? null : zoneFromPoint(e.clientX, e.clientY);
      if (z) placeMany(d.ids, z.dataset.zone);
      return;
    }
    if (d.moved) { markChanged(); render(); }
    else undoStack.pop();
  }
  document.addEventListener('pointerup', (e) => endDrag(e, false));
  document.addEventListener('pointercancel', (e) => endDrag(e, true));

  // Keyboard users: Enter or Space on a name selects it; on a room's numbers, picks up everyone there.
  document.addEventListener('click', (e) => {
    if (ui.view !== 'plan' || editLayout || e.detail !== 0) return;
    const c = e.target.closest('.chip');
    if (c && !c.closest('.ghost')) { toggleSelected(c.dataset.pid); return; }
    const roomBtn = e.target.closest('[data-select-room]');
    if (roomBtn) pickUpRoom(roomBtn.dataset.selectRoom);
  });

  // ---------- Keyboard ----------
  document.addEventListener('keydown', (e) => {
    if (document.querySelector('dialog[open]')) return;
    const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]');
    const mod = e.ctrlKey || e.metaKey;
    if (mod && !e.altKey && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (mod && !e.altKey && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveBackup(); return; }
    if (typing) { if (e.key === 'Enter' && e.target.classList.contains('room-lesson')) e.target.blur(); return; }
    if (e.key === 'Escape') {
      if (sel.size) { sel.clear(); render(); }
      else if (editLayout) { editLayout = false; render(); }
      return;
    }
    if (ui.view !== 'plan') return;
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.room[data-zone]') && sel.size) {
      e.preventDefault();
      placeMany([...sel], e.target.dataset.zone);
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      if (e.target.closest && e.target.closest('.chip')) return;
      e.preventDefault();
      stepSlot(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  // ---------- Start ----------
  function boot() {
    let saved = null, raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { storageOk = false; }
    try { if (raw) saved = JSON.parse(raw); } catch (e) { saved = null; }
    project = saved ? sanitize(saved) : blankProject();
    if (!ZOOMS.includes(ui.zoom)) ui.zoom = 1;
    if (!['plan', 'week', 'print', 'setup'].includes(ui.view)) ui.view = 'plan';
    render();
    if (!saved) {
      const old = findOld();
      if (old && !ui.oldDeclined) offerOld(old);
    }
  }
  boot();
})();
</script>
</body>
</html>
