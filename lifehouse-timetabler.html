    if (document.querySelector('dialog[open]')) return;
    if (SHEET_MODE) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        const i = DAYS.findIndex((d) => d.id === sheetDayId());
        showSheetDay(DAYS[(i + (e.key === 'ArrowRight' ? 1 : DAYS.length - 1)) % DAYS.length].id);
      }
      return;
    }
    const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]');
    const mod = e.ctrlKey || e.metaKey;
    if (mod && !e.altKey && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (mod && !e.altKey && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveBackup(); return; }
    if (typing) { if (e.key === 'Enter' && e.target.classList.contains('room-lesson')) e.target.blur(); return; }
    if (e.key === 'Escape') {
      if (sel.size) { sel.clear(); render(); }
      else if (editLayout) { editLayout = false; render(); }
      return;
    }
    if ((e.key === 'f' || e.key === 'F') && !mod && !e.altKey) { e.preventDefault(); toggleFullscreen(); return; }
    if (ui.view !== 'plan') return;
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.room[data-zone]') && sel.size) {
      e.preventDefault();
      placeMany([...sel], e.target.dataset.zone);
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      if (e.target.closest && e.target.closest('.chip')) return;
      e.preventDefault();
      stepSlot(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  // ---------- Start ----------
  function boot() {
    let saved = null, raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { storageOk = false; }
    try { if (raw) saved = JSON.parse(raw); } catch (e) { saved = null; }
    project = saved ? sanitize(saved) : blankProject();
    // A plan on the to-scale drawing or the earlier grid moves to the school layout; places and placements stay.
    let movedToRoomy = null;
    const onScale = project.map.imageId && project.map.imageId === rememberImage(DEFAULT_PLAN.image) && !ui.keptScale;
    const onGrid = Object.entries(OLD_GRID).every(([id, pos]) => { const a = project.areas.find((x) => x.id === id); return a && a.x === pos[0] && a.y === pos[1] && a.w === pos[2] && a.h === pos[3]; });
    // A plan on the school layout from before the building tabs and the main building's real shape moves to the new one.
    const oldSchool = saved && Array.isArray(saved.outlines) && saved.outlines.some((o) => o && o.id === 'B2' && o.name === 'Main building') && !saved.outlines.some((o) => o && 'tone' in o) && !ui.keptOldMap;
    if (saved && !SHEET_MODE && (onScale || onGrid || oldSchool)) {
      movedToRoomy = JSON.stringify(project);
      applyLayout(project, 'school');
      project = sanitize(project);
    }
    // A plan still on the earlier built-in room layout, with nobody added, moves to the school floor plan.
    if (saved && !SHEET_MODE && !project.people.length && !Object.keys(project.slots).length && !project.map.imageId && project.areas.some((a) => a.name === 'Central Learning Space')) {
      const fresh = blankProject();
      project = Object.assign(fresh, { name: project.name, school: project.school, periods: project.periods });
    }
    if (!ZOOMS.includes(ui.zoom)) ui.zoom = 1;
    if (!['plan', 'week', 'print', 'setup'].includes(ui.view)) ui.view = 'plan';
    render();
    if (movedToRoomy) {
      saveNow();
      toast(oldSchool ? 'The map has a new look: the main building’s real shape, building names and room icons. Undo puts your old layout back.'
        : 'Map now follows the school layout, with room for names. Setup → Change map layout has the exact-size drawing.', { label: 'Undo', run: () => { undo(); if (oldSchool) ui.keptOldMap = true; else ui.keptScale = true; saveUI(); } });
      undoStack = [movedToRoomy];
      renderTopbar();
    }
    if (SHEET_MODE) {
      sheetSeen = { plan: raw, ui: localStorage.getItem(UI_KEY) };
      setInterval(followMain, 1500);
    }
    if (!saved && !SHEET_MODE) {
      const old = findOld();
      if (old && !ui.oldDeclined) offerOld(old);
    }
  }
  boot();
})();
</script>
